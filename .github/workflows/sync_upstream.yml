                  match = config_pattern.match(line)
                  if match:
                      symbols.append(match.group(1))
              duplicates = sorted(symbol for symbol, count in Counter(symbols).items() if count > 1)
              if duplicates:
                  raise SystemExit(f"{path}: duplicate config symbols: {duplicates[:20]}")

          print("Generated repository structural validation passed")
          PY

          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find compile_script diy_script -type f -name '*.sh' -print0)

          platform_output="$(mktemp)"
          GITHUB_OUTPUT="$platform_output" bash compile_script/platforms.sh > /tmp/platforms.stdout
          PLATFORM_OUTPUT="$platform_output" python3 - <<'PY'
          import json
          import os
          from pathlib import Path


          values = {}
          for line in Path(os.environ["PLATFORM_OUTPUT"]).read_text(encoding="utf-8").splitlines():
              key, value = line.split("=", 1)
              values[key] = json.loads(value)

          if set(values) != {"matrix", "source_matrix_json"}:
              raise SystemExit(f"Unexpected platforms.sh outputs: {sorted(values)}")
          platforms = {item["platform"] for item in values["matrix"]}
          required = {"X86", "X86_AllImages", "X86_VMware", "AX3600", "AX3600_stock"}
          if not required.issubset(platforms):
              raise SystemExit(f"Main matrix is missing custom platforms: {sorted(required - platforms)}")
          if {item["source_code_platform"] for item in values["source_matrix_json"]} != {"immortalwrt"}:
              raise SystemExit("Source matrix must contain ImmortalWrt only")
          for item in values["matrix"]:
              config = Path(item["value"]["CONFIGS"]) / f"{item['platform']}.config"
              if not config.is_file():
                  raise SystemExit(f"Matrix config is missing: {config}")
          print(f"Platform matrix OK: build={len(platforms)}")
          PY

          if [ "$ACTIONLINT_VERSION" != "v1.7.7" ]; then
            echo "::error::Update ACTIONLINT_SHA256 together with ACTIONLINT_VERSION"
            exit 1
          fi

          actionlint_version="${ACTIONLINT_VERSION#v}"
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_url="https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${actionlint_archive}"
          actionlint_dir="$(mktemp -d)"
          trap 'rm -rf "$actionlint_dir"' EXIT

          curl --fail --location --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            --output "$actionlint_dir/$actionlint_archive" \
            "$actionlint_url"

          (
            cd "$actionlint_dir"
            printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum -c -
            tar -xzf "$actionlint_archive"
          )
          # Keep core workflow linting; shell/Python syntax is validated above without deadlock-prone external pipes.
          timeout 120s "$actionlint_dir/actionlint" -color -shellcheck= -pyflakes=

      - name: Create sync audit report
        if: always()
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          report_dir="/tmp/sync-report"
          mkdir -p "$report_dir"
          git status --short > "$report_dir/status.txt"
          git diff --stat "$UPSTREAM_SHA" > "$report_dir/diff-stat.txt"
          git diff --name-status "$UPSTREAM_SHA" > "$report_dir/changed-files.txt"
          git diff --binary "$UPSTREAM_SHA" > "$report_dir/generated.patch"
          find .github/workflows -maxdepth 1 -type f -name '*.yml' -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$report_dir/workflow-sha256.txt"

          {
            echo "### Upstream sync audit"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream | \`${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}\` |"
            echo "| Validation | \`${VALIDATION_OUTCOME}\` |"
            echo "| Dry run | \`${{ inputs.dry_run || false }}\` |"
            echo ""
            echo "#### Generated diff"
            echo ""
            sed -n '1,80p' "$report_dir/diff-stat.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/sync-report
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and push
        id: publish
        if: steps.validate.outcome == 'success'
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          PREVIOUS_SHA: ${{ steps.upstream.outputs.previous_sha }}
          UPSTREAM_SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "pushed=false" >> "$GITHUB_OUTPUT"

          git add -A
          generated_tree="$(git write-tree)"
          previous_tree="$(git rev-parse "${PREVIOUS_SHA}^{tree}")"
          if [ "$generated_tree" = "$previous_tree" ]; then
            echo "Generated tree is unchanged; nothing to publish."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run requested; generated changes were validated but will not be pushed."
            git diff --cached --stat
            exit 0
          fi

          git commit -m "chore: sync OpenWrtAction ${UPSTREAM_SHORT_SHA}"
          git push \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${PREVIOUS_SHA}" \
            origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger build workflow
        if: steps.validate.outcome == 'success' && !inputs.dry_run && (steps.publish.outputs.pushed == 'true' || inputs.force_build)
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type="openwrt_source_update_v6"
        env:
          GH_TOKEN: ${{ secrets.X86OPENWRT }}
