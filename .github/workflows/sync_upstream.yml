          do
              if [ -d "$ghfu_dir" ]; then
                  echo "Patch luci-app-ghfu default repo in $ghfu_dir"
                  find "$ghfu_dir" -type f -exec sed -i "s|smallprogram/OpenWrtAction|${GHFU_DEFAULT_REPO}|g" {} +
              fi
          done

          mkdir -p files/etc/config files/etc/uci-defaults
