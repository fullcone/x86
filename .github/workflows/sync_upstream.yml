#
# 同步上游 OpenWrtAction 并应用自定义补丁
# Fork from: https://github.com/smallprogram/OpenWrtAction
#

name: Sync Upstream and Patch

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00 (北京时间 10:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and report without pushing changes'
        required: false
        type: boolean
        default: false
      force_build:
        description: 'Trigger a firmware build even when sync has no changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openwrt-repository-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: smallprogram/OpenWrtAction
  UPSTREAM_REF: main
  ACTIONLINT_VERSION: v1.7.7
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.X86OPENWRT }}

      - name: Preflight
        env:
          SYNC_TOKEN: ${{ secrets.X86OPENWRT }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Repository secret X86OPENWRT is required."
            exit 1
          fi
          for command_name in git gh python3; do
            command -v "$command_name" >/dev/null || {
              echo "::error::Required command is missing: $command_name"
              exit 1
            }
          done

      - name: Setup Git
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Backup custom files
        run: |
          set -euo pipefail
          mkdir -p /tmp/backup/.github/workflows
          cp .github/workflows/sync_upstream.yml /tmp/backup/.github/workflows/

      - name: Sync upstream
        id: upstream
        run: |
          set -euo pipefail

          previous_sha="$(git rev-parse HEAD)"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"

          upstream_url="https://github.com/${UPSTREAM_REPOSITORY}.git"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "$upstream_url"
          else
            git remote add upstream "$upstream_url"
          fi

          git fetch --no-tags upstream "$UPSTREAM_REF"
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          upstream_short_sha="$(git rev-parse --short=12 "$upstream_sha")"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$upstream_short_sha" >> "$GITHUB_OUTPUT"
          echo "Syncing ${UPSTREAM_REPOSITORY}@${upstream_sha}"
          git reset --hard "$upstream_sha"

      - name: Restore custom files
        run: |
          set -euo pipefail
          cp /tmp/backup/.github/workflows/sync_upstream.yml .github/workflows/

      - name: Keep ImmortalWrt only
        run: |
          set -euo pipefail

          # 修改 platforms.sh，只保留 immortalwrt
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("compile_script/platforms.sh")
          text = path.read_text(encoding="utf-8")
          old = "source_code_platforms=(openwrt immortalwrt lede)"
          new = "source_code_platforms=(immortalwrt)"

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("未找到 source_code_platforms，无法确认上游 platforms.sh 结构")

          pattern = re.compile(r"immortalwrt_platforms=\(([^)]*)\)")
          match = pattern.search(text)
          if not match:
              raise SystemExit("未找到 immortalwrt_platforms，无法添加自定义平台")

          platforms = match.group(1).split()

          def ensure_platform(name, after=None):
              if name in platforms:
                  return
              if after in platforms:
                  platforms.insert(platforms.index(after) + 1, name)
              else:
                  platforms.append(name)

          ensure_platform("X86_AllImages", "X86")
          ensure_platform("X86_VMware", "X86_AllImages")
          ensure_platform("AX3600", "X86_VMware")
          ensure_platform("AX3600_stock", "AX3600")
          text = text[:match.start(1)] + " ".join(platforms) + text[match.end(1):]

          path.write_text(text, encoding="utf-8")
          PY

          # 删除不需要的平台
          rm -rf diy_script/openwrt_diy
          rm -rf diy_script/lean_diy
          rm -rf config/openwrt_config
          rm -rf config/leanlede_config
          rm -rf git_log/openwrt 2>/dev/null || true
          rm -rf git_log/lede 2>/dev/null || true

          build_workflow="$(
            find .github/workflows -maxdepth 1 -type f \( \
              -name 'Build_Multi_Platform(V6).yml' -o \
              -name 'Build-OpenWrt_Multi-Platform(V6).yml' \
            \) | sort | head -n 1
          )"
          if [ -z "$build_workflow" ]; then
            echo "未找到 V6 构建工作流"
            find .github/workflows -maxdepth 1 -type f -print
            exit 1
          fi
          build_workflow_name="$(basename "$build_workflow")"

          # 保留职责清晰且经过本 workflow 适配的工程工作流。
          find .github/workflows -maxdepth 1 -type f -name '*.yml' \
            ! -name "$build_workflow_name" \
            ! -name 'Update_Checker.yml' \
            ! -name 'sync_upstream.yml' \
            -delete

          echo "=== 只保留 ImmortalWrt ==="
          grep "source_code_platforms" compile_script/platforms.sh
          echo "=== 保留的工作流 ==="
          ls -1 .github/workflows

      - name: Verify QEMU and Samba4 config
        run: |
          echo "=== 检查 X86.config 中的 QEMU/KVM 配置 ==="
          grep -E "qemu|kvm|virtio" config/immortalwrt_config/X86.config || echo "未找到 QEMU 相关配置"
          echo ""
          echo "=== 检查 X86.config 中的 Samba4 配置 ==="
          grep -E "samba4" config/immortalwrt_config/X86.config || echo "未找到 Samba4 相关配置"

      - name: Patch ImmortalWrt config packages
        run: |
          set -euo pipefail
          shopt -s nullglob

          enable_config() {
            local file="$1"
            local symbol="$2"

            if grep -Fxq "# ${symbol} is not set" "$file"; then
              sed -i "s|^# ${symbol} is not set$|${symbol}=y|" "$file"
            elif grep -q "^${symbol}=" "$file"; then
              sed -i "s|^${symbol}=.*|${symbol}=y|" "$file"
            else
              printf '\n%s=y\n' "$symbol" >> "$file"
            fi
          }

          disable_config() {
            local file="$1"
            local symbol="$2"

            if grep -q "^${symbol}=" "$file"; then
              sed -i "s|^${symbol}=.*|# ${symbol} is not set|" "$file"
            elif ! grep -Fxq "# ${symbol} is not set" "$file"; then
              printf '\n# %s is not set\n' "$symbol" >> "$file"
            fi
          }

          immortal_configs=(config/immortalwrt_config/*.config)
          if [ "${#immortal_configs[@]}" -eq 0 ]; then
            echo "未找到 ImmortalWrt 配置文件"
            exit 1
          fi

          # 为所有 ImmortalWrt 配置添加 Samba4
          for config in "${immortal_configs[@]}"; do
            echo "处理: $config"
            enable_config "$config" CONFIG_PACKAGE_luci-app-samba4
            enable_config "$config" CONFIG_PACKAGE_luci-i18n-samba4-zh-cn
          done

          # FullConeFlow replaces mwan3 on x86, and non-x86 profiles keep the
          # multi-WAN policy stack out by default.
          for config in "${immortal_configs[@]}"; do
            disable_config "$config" CONFIG_PACKAGE_mwan3
            disable_config "$config" CONFIG_PACKAGE_luci-app-mwan3
            disable_config "$config" CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn
            disable_config "$config" CONFIG_PACKAGE_luci-app-syncdial
          done

          x86_config="config/immortalwrt_config/X86.config"
          if [ ! -f "$x86_config" ]; then
            echo "未找到 X86 配置文件: $x86_config"
            exit 1
          fi

          for symbol in \
            CONFIG_PACKAGE_docker \
            CONFIG_PACKAGE_dockerd \
            CONFIG_PACKAGE_luci-app-dockerman \
            CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn \
            CONFIG_PACKAGE_conntrack \
            CONFIG_PACKAGE_ip-full \
            CONFIG_PACKAGE_jq \
            CONFIG_PACKAGE_nftables-json \
            CONFIG_PACKAGE_coreutils-timeout \
            CONFIG_PACKAGE_kmod-sched-bpf \
            CONFIG_PACKAGE_kmod-bonding \
            CONFIG_PACKAGE_kmod-ifb \
            CONFIG_PACKAGE_tc-bpf \
            CONFIG_PACKAGE_bpftool-full \
            CONFIG_PACKAGE_libbpf \
            CONFIG_PACKAGE_fullcone-flow \
            CONFIG_PACKAGE_mdadm \
            CONFIG_PACKAGE_kmod-md-mod \
            CONFIG_PACKAGE_kmod-md-raid1 \
            CONFIG_PACKAGE_kmod-lib-crc32c \
            CONFIG_PACKAGE_e2fsprogs \
            CONFIG_PACKAGE_resize2fs \
            CONFIG_PACKAGE_cpio \
            CONFIG_PACKAGE_gzip \
            CONFIG_PACKAGE_kmod-kvm-intel \
            CONFIG_PACKAGE_kmod-kvm-amd \
            CONFIG_PACKAGE_kmod-e1000e \
            CONFIG_PACKAGE_kmod-igb \
            CONFIG_PACKAGE_kmod-igc \
            CONFIG_PACKAGE_kmod-ixgbe \
            CONFIG_PACKAGE_kmod-i40e \
            CONFIG_PACKAGE_kmod-ice \
            CONFIG_PACKAGE_kmod-iavf \
            CONFIG_PACKAGE_kmod-mlx4-core \
            CONFIG_PACKAGE_kmod-mlx5-core \
            CONFIG_PACKAGE_kmod-bnx2x \
            CONFIG_PACKAGE_kmod-tg3 \
            CONFIG_PACKAGE_kmod-nbd \
            CONFIG_PACKAGE_kmod-nfnetlink-queue \
            CONFIG_PACKAGE_iptables-mod-nfqueue \
            CONFIG_PACKAGE_pciutils \
            CONFIG_PACKAGE_usbutils \
            CONFIG_PACKAGE_ethtool \
            CONFIG_PACKAGE_qemu-x86_64-softmmu \
            CONFIG_PACKAGE_qemu-bridge-helper \
            CONFIG_PACKAGE_qemu-ga \
            CONFIG_PACKAGE_qemu-img \
            CONFIG_PACKAGE_qemu-keymaps \
            CONFIG_PACKAGE_qemu-nbd \
            CONFIG_PACKAGE_qemu-firmware-efi \
            CONFIG_PACKAGE_qemu-firmware-seabios \
            CONFIG_PACKAGE_qemu-firmware-seavgabios \
            CONFIG_PACKAGE_qemu-firmware-pxe \
            CONFIG_PACKAGE_virtio-console-helper \
            CONFIG_PACKAGE_shadow-utils
          do
            enable_config "$x86_config" "$symbol"
          done

          # fullcone-flow needs tc-bpf. Keep tc provider selection explicit so
          # apk does not try to install both tc-bpf and tc-tiny into the rootfs.
          enable_config "$x86_config" CONFIG_PACKAGE_tc-bpf
          disable_config "$x86_config" CONFIG_PACKAGE_tc-tiny
          disable_config "$x86_config" CONFIG_PACKAGE_tc-full

          # qemu-ga and open-vm-tools both ship /sbin/shutdown in the apk rootfs install.
          # Prefer qemu-ga for Proxmox/QEMU usage and avoid package/install conflicts.
          disable_config "$x86_config" CONFIG_PACKAGE_open-vm-tools
          disable_config "$x86_config" CONFIG_PACKAGE_open-vm-tools-fuse

          # FullConeFlow ships its own standalone UI and rpcd ACL. Do not
          # pull the retired LuCI compatibility package into firmware images.
          disable_config "$x86_config" CONFIG_PACKAGE_luci-app-fullcone-flow

          x86_allimages_config="config/immortalwrt_config/X86_AllImages.config"
          cp "$x86_config" "$x86_allimages_config"
          for symbol in \
            CONFIG_QCOW2_IMAGES \
            CONFIG_VDI_IMAGES \
            CONFIG_VHDX_IMAGES \
            CONFIG_VMDK_IMAGES \
            CONFIG_TARGET_ROOTFS_SQUASHFS \
            CONFIG_TARGET_ROOTFS_TARGZ \
            CONFIG_TARGET_ROOTFS_EXT4FS \
            CONFIG_GRUB_IMAGES \
            CONFIG_GRUB_EFI_IMAGES \
            CONFIG_TARGET_IMAGES_GZIP
          do
            enable_config "$x86_allimages_config" "$symbol"
          done

          # Keep the primary X86 flavor focused on the installable images that
          # the installer ISO job depends on. Optional VM/rootfs formats are
          # built by X86_AllImages so a slow conversion does not block the main
          # x86 firmware path.
          for symbol in \
            CONFIG_QCOW2_IMAGES \
            CONFIG_VDI_IMAGES \
            CONFIG_VHDX_IMAGES \
            CONFIG_VMDK_IMAGES \
            CONFIG_TARGET_ROOTFS_SQUASHFS \
            CONFIG_TARGET_ROOTFS_TARGZ
          do
            disable_config "$x86_config" "$symbol"
          done
          for symbol in \
            CONFIG_TARGET_ROOTFS_EXT4FS \
            CONFIG_GRUB_IMAGES \
            CONFIG_GRUB_EFI_IMAGES \
            CONFIG_TARGET_IMAGES_GZIP
          do
            enable_config "$x86_config" "$symbol"
          done

          vmware_config="config/immortalwrt_config/X86_VMware.config"
          cp "$x86_config" "$vmware_config"
          disable_config "$vmware_config" CONFIG_PACKAGE_qemu-ga
          enable_config "$vmware_config" CONFIG_PACKAGE_open-vm-tools
          disable_config "$vmware_config" CONFIG_PACKAGE_open-vm-tools-fuse
          # VMware flavor only needs ext4 VMDK output. Disable other VM image
          # conversions/rootfs formats to reduce build and upload pressure.
          for symbol in \
            CONFIG_QCOW2_IMAGES \
            CONFIG_VDI_IMAGES \
            CONFIG_VHDX_IMAGES \
            CONFIG_TARGET_ROOTFS_SQUASHFS \
            CONFIG_TARGET_ROOTFS_TARGZ
          do
            disable_config "$vmware_config" "$symbol"
          done
          for symbol in \
            CONFIG_TARGET_ROOTFS_EXT4FS \
            CONFIG_GRUB_IMAGES \
            CONFIG_GRUB_EFI_IMAGES \
            CONFIG_VMDK_IMAGES \
            CONFIG_TARGET_IMAGES_GZIP
          do
            enable_config "$vmware_config" "$symbol"
          done

          echo "=== X86_VMware guest agent 差异 ==="
          grep -E "qemu-ga|open-vm-tools" "$vmware_config" || true
          echo "=== X86_VMware 镜像格式差异 ==="
          grep -E "TARGET_ROOTFS|GRUB.*IMAGES|QCOW2_IMAGES|VDI_IMAGES|VMDK_IMAGES|VHDX_IMAGES|TARGET_IMAGES_GZIP" "$vmware_config" || true

          echo "=== X86_AllImages 镜像格式 ==="
          grep -E "TARGET_ROOTFS|GRUB.*IMAGES|QCOW2_IMAGES|VDI_IMAGES|VMDK_IMAGES|VHDX_IMAGES|TARGET_IMAGES_GZIP" "$x86_allimages_config" || true
          echo "=== X86 主版本镜像格式 ==="
          grep -E "TARGET_ROOTFS|GRUB.*IMAGES|QCOW2_IMAGES|VDI_IMAGES|VMDK_IMAGES|VHDX_IMAGES|TARGET_IMAGES_GZIP" "$x86_config" || true
          echo "=== X86 配置补丁摘要 ==="
          grep -E "samba4|docker|dockerman|mwan3|qemu|kvm|virtio|shadow|open-vm-tools" "$x86_config" | sed -n '1,140p'

      - name: Add Xiaomi AX3600 configs
        run: |
          set -euo pipefail

          ax3600_config="config/immortalwrt_config/AX3600.config"
          ax3600_stock_config="config/immortalwrt_config/AX3600_stock.config"
          mkdir -p "$(dirname "$ax3600_config")"

          cat > "$ax3600_config" <<'EOFAX3600'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600=y

          CONFIG_LUCI_LANG_zh_Hans=y

          # Xiaomi AX3600 wireless and Qualcomm acceleration baseline.
          CONFIG_PACKAGE_kmod-ath=y
          CONFIG_ATH_USER_REGD=y
          CONFIG_PACKAGE_ATH_DFS=y
          CONFIG_PACKAGE_kmod-ath11k=y
          CONFIG_ATH11K_THERMAL=y
          CONFIG_PACKAGE_ath11k-firmware-ipq8074=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_MAC80211_MESH=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_DRIVER_11AC_SUPPORT=y
          CONFIG_DRIVER_11AX_SUPPORT=y
          CONFIG_PACKAGE_kmod-qca-nss-dp=y
          CONFIG_PACKAGE_kmod-qca-ssdk-nohnat=y
          CONFIG_PACKAGE_nss-firmware-ipq8074=y
          CONFIG_PACKAGE_qca-ssdk-shell=y

          # Router memory and DNS baseline.
          CONFIG_PACKAGE_kmod-zram=y
          CONFIG_PACKAGE_zram-swap=y
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_auth=y
          CONFIG_PACKAGE_dnsmasq_full_conntrack=y
          CONFIG_PACKAGE_dnsmasq_full_dhcp=y
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_dnsmasq_full_dnssec=y
          CONFIG_PACKAGE_dnsmasq_full_ipset=y
          CONFIG_PACKAGE_dnsmasq_full_noid=y
          CONFIG_PACKAGE_dnsmasq_full_tftp=y
          CONFIG_PACKAGE_6in4=y
          CONFIG_PACKAGE_6rd=y
          CONFIG_PACKAGE_6to4=y
          CONFIG_PACKAGE_ipv6helper=y

          # AX3600 feature set, adapted from yaya131's AX3600/qualcommax configs.
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-ssr-plus=y
          CONFIG_PACKAGE_luci-app-ssr-plus_Nftables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Client=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Server=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ChinaDNS_NG=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_DNS2SOCKS=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_DNSPROXY=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Libev_Client=y
          CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Libev_Server=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns_INCLUDE_WebUI=y
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_smartdns-ui=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-guest-wifi=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE=y
          CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-app-autoreboot=y

          # Keep x86/NAS-only payloads out of the AX3600 image.
          # CONFIG_PACKAGE_luci-app-samba4 is not set
          # CONFIG_PACKAGE_mwan3 is not set
          # CONFIG_PACKAGE_luci-app-mwan3 is not set
          # CONFIG_PACKAGE_luci-app-syncdial is not set
          # CONFIG_PACKAGE_qemu-ga is not set
          # CONFIG_PACKAGE_qemu-x86_64-softmmu is not set
          # CONFIG_PACKAGE_kmod-kvm-intel is not set
          # CONFIG_PACKAGE_kmod-kvm-amd is not set
          # CONFIG_PACKAGE_kmod-ixgbe is not set
          # CONFIG_PACKAGE_kmod-i40e is not set
          # CONFIG_PACKAGE_kmod-ice is not set
          EOFAX3600

          sed -i 's/^          //' "$ax3600_config"
          cp "$ax3600_config" "$ax3600_stock_config"
          sed -i 's/^CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600=y$/CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600-stock=y/' "$ax3600_stock_config"

          echo "=== AX3600 platform entries ==="
          grep -n "immortalwrt_platforms" compile_script/platforms.sh
          echo "=== AX3600 target and key packages ==="
          grep -E "TARGET_qualcommax|xiaomi_ax3600|ath11k|qca-|openclash|passwall|ssr-plus|smartdns|turboacc|mwan3|syncdial|samba4|qemu|kvm|ixgbe|i40e|ice" "$ax3600_config"
          echo "=== AX3600 stock target and key packages ==="
          grep -E "TARGET_qualcommax|xiaomi_ax3600|ath11k|qca-|openclash|passwall|ssr-plus|smartdns|turboacc|mwan3|syncdial|samba4|qemu|kvm|ixgbe|i40e|ice" "$ax3600_stock_config"

      - name: Add QEMU bridge config to diy script
        run: |
          set -euo pipefail

          diy_part2="diy_script/immortalwrt_diy/diy-part2.sh"
          if [ ! -f "$diy_part2" ]; then
            echo "未找到 diy-part2.sh: $diy_part2"
            exit 1
          fi

          if ! grep -q "files/etc/qemu/bridge.conf" "$diy_part2"; then
            # 在 diy-part2.sh 末尾添加 QEMU 桥接配置
            cat >> "$diy_part2" << 'EOFQEMU'

          # Add QEMU bridge config
          mkdir -p files/etc/qemu
          echo "allow br-lan" > files/etc/qemu/bridge.conf
          EOFQEMU
          fi

          echo "=== QEMU 桥接配置已添加 ==="
          tail -5 "$diy_part2"

      - name: Use upstream SmartDNS custom package flow
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path


          custom = Path("diy_script/custom_feeds_and_packages.sh")
          if not custom.exists():
              raise SystemExit(f"missing custom package script: {custom}")

          custom_text = custom.read_text(encoding="utf-8")
          required_clones = (
              "github.com/pymumu/openwrt-smartdns.git",
              "github.com/pymumu/luci-app-smartdns.git",
          )
          missing = [url for url in required_clones if url not in custom_text]
          if missing:
              raise SystemExit(f"upstream SmartDNS clone definitions are missing: {missing}")

          diy_part3 = Path("diy_script/immortalwrt_diy/diy-part3.sh")
          if not diy_part3.exists():
              raise SystemExit(f"missing diy-part3.sh: {diy_part3}")

          text = diy_part3.read_text(encoding="utf-8")
          required_flow = (
              "cd package/custom_packages/openwrt-smartdns",
              "package/custom_packages/openwrt-smartdns/download",
              "package/custom_packages/openwrt-smartdns/check FIXUP=1",
          )
          missing = [marker for marker in required_flow if marker not in text]
          if missing:
              raise SystemExit(f"upstream SmartDNS diy-part3 flow is incomplete: {missing}")

          strict_marker = "# fullcone fail-fast diy-part3"
          if strict_marker not in text:
              anchor = "attempts=$1\n"
              if anchor not in text:
                  raise SystemExit("diy-part3 attempts anchor is missing")
              replacement = 'attempts="${1:-1}"\n\n# fullcone fail-fast diy-part3\nset -euo pipefail\n'
              text = text.replace(anchor, replacement, 1)
              diy_part3.write_text(text, encoding="utf-8")
          PY

          echo "=== Upstream SmartDNS custom package flow ==="
          grep -n "pymumu/.*smartdns" diy_script/custom_feeds_and_packages.sh
          grep -nE "fullcone fail-fast|package/custom_packages/openwrt-smartdns" \
            diy_script/immortalwrt_diy/diy-part3.sh

      - name: Patch Nikki mihomo Kconfig conflict
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path


          path = Path("diy_script/immortalwrt_diy/diy-part2.sh")
          if not path.exists():
              raise SystemExit(f"missing diy-part2.sh: {path}")

          text = path.read_text(encoding="utf-8")
          marker = "# fullcone nikki mihomo conflict compatibility"
          if marker not in text:
              anchor = "# Modify default IP\n"
              if anchor not in text:
                  raise SystemExit("default IP anchor is missing; cannot add Nikki compatibility patch")
              block = r'''# fullcone nikki mihomo conflict compatibility
          nikki_alpha_makefile="feeds/nikki/mihomo-alpha/Makefile"
          nikki_meta_makefile="feeds/nikki/mihomo-meta/Makefile"

          for makefile in "$nikki_alpha_makefile" "$nikki_meta_makefile"; do
              test -f "$makefile" || {
                  echo "Missing Nikki package definition: $makefile"
                  exit 1
              }
          done

          if grep -qE '^[[:space:]]*CONFLICTS:=mihomo-meta[[:space:]]*$' "$nikki_alpha_makefile" \
              && grep -qE '^[[:space:]]*CONFLICTS:=mihomo-alpha[[:space:]]*$' "$nikki_meta_makefile"; then
              sed -i '/^[[:space:]]*CONFLICTS:=mihomo-alpha[[:space:]]*$/d' "$nikki_meta_makefile"
              echo "Removed redundant mihomo-meta -> mihomo-alpha conflict"
          fi

          if grep -qE '^[[:space:]]*CONFLICTS:=mihomo-meta[[:space:]]*$' "$nikki_alpha_makefile" \
              && grep -qE '^[[:space:]]*CONFLICTS:=mihomo-alpha[[:space:]]*$' "$nikki_meta_makefile"; then
              echo "Nikki mihomo packages still contain a recursive conflict"
              exit 1
          fi

          '''
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, encoding="utf-8")
          PY

          echo "=== Nikki mihomo Kconfig compatibility marker ==="
          grep -n "fullcone nikki mihomo conflict compatibility" \
            diy_script/immortalwrt_diy/diy-part2.sh

      - name: Modify default IP to 172.16.0.253
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("diy_script/immortalwrt_diy/diy-part2.sh")
          text = path.read_text(encoding="utf-8")
          target = "sed -i 's/192.168.1.1/172.16.0.253/g'"
          pattern = re.compile(r"sed -i 's/192\.168\.1\.1/[^']+/g'")

          text, count = pattern.subn(target, text, count=1)
          if count == 0 and target not in text:
              raise SystemExit("未找到默认 IP 修改逻辑，无法确认 diy-part2.sh 结构")

          path.write_text(text, encoding="utf-8")
          PY

          echo "=== 默认 IP 已修改为 172.16.0.253 ==="
          grep "192.168.1.1" diy_script/immortalwrt_diy/diy-part2.sh

      - name: Set GitHub Firmware Upgrade default repo
        run: |
          set -euo pipefail

          diy_part2="diy_script/immortalwrt_diy/diy-part2.sh"
          if [ ! -f "$diy_part2" ]; then
            echo "未找到 diy-part2.sh: $diy_part2"
            exit 1
          fi

          if ! grep -q "fullcone ghfu default repo" "$diy_part2"; then
            cat >> "$diy_part2" <<'EOFGHFU'

          # fullcone ghfu default repo
          GHFU_DEFAULT_REPO="fullcone/x86"
          for ghfu_dir in \
              feeds/ghfu/luci-app-ghfu \
              feeds/luci/applications/luci-app-ghfu \
