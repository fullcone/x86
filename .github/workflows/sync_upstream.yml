#
# 同步上游 OpenWrtAction 并应用自定义补丁
# Fork from: https://github.com/smallprogram/OpenWrtAction
#

name: Sync Upstream and Patch

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00 (北京时间 10:00)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.X86OPENWRT }}

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Backup custom files
        run: |
          mkdir -p /tmp/backup
          cp .github/workflows/sync_upstream.yml /tmp/backup/

      - name: Sync upstream
        run: |
          if ! git remote | grep -q upstream; then
            git remote add upstream https://github.com/smallprogram/OpenWrtAction.git
          fi
          git fetch upstream
          git reset --hard upstream/main

      - name: Restore custom files
        run: |
          cp /tmp/backup/sync_upstream.yml .github/workflows/

      - name: Keep ImmortalWrt only
        run: |
          # 修改 platforms.sh，只保留 immortalwrt
          sed -i "s/source_code_platforms=(openwrt immortalwrt lede)/source_code_platforms=(immortalwrt)/" compile_script/platforms.sh
          
          # 删除不需要的平台
          rm -rf diy_script/openwrt_diy
          rm -rf diy_script/lean_diy
          rm -rf config/openwrt_config
          rm -rf config/leanlede_config
          rm -rf git_log/openwrt 2>/dev/null || true
          rm -rf git_log/lede 2>/dev/null || true
          
          # 删除不需要的工作流（只保留 Build-OpenWrt_Multi-Platform(V5).yml 和 sync_upstream.yml）
          rm -f .github/workflows/Merge-upstream.yml 2>/dev/null || true
          rm -f .github/workflows/Retry_Failure_Jobs.yml 2>/dev/null || true
          rm -f .github/workflows/*SelfHost*.yml 2>/dev/null || true
          rm -f .github/workflows/Update_Checker.yml 2>/dev/null || true
          rm -f .github/workflows/test*.yml 2>/dev/null || true
          rm -f .github/workflows/Close_stale_issues_and_PRs.yml 2>/dev/null || true
          rm -f ".github/workflows/Close stale issues and PRs.yml" 2>/dev/null || true
          rm -f .github/workflows/defconfig.yml 2>/dev/null || true
          rm -f .github/workflows/Retry_All_Jobs.yml 2>/dev/null || true
          
          echo "=== 只保留 ImmortalWrt ==="
          grep "source_code_platforms" compile_script/platforms.sh

      - name: Verify QEMU and Samba4 config
        run: |
          echo "=== 检查 X86.config 中的 QEMU/KVM 配置 ==="
          grep -E "qemu|kvm|virtio" config/immortalwrt_config/X86.config || echo "未找到 QEMU 相关配置"
          echo ""
          echo "=== 检查 X86.config 中的 Samba4 配置 ==="
          grep -E "samba4" config/immortalwrt_config/X86.config || echo "未找到 Samba4 相关配置"

      - name: Add samba4 to ImmortalWrt config
        run: |
          # 为所有 ImmortalWrt 配置添加 samba4
          for config in config/immortalwrt_config/*.config; do
            echo "处理: $config"
            # luci-app-samba4 存在于配置中，用 sed 替换
            sed -i 's/# CONFIG_PACKAGE_luci-app-samba4 is not set/CONFIG_PACKAGE_luci-app-samba4=y/' "$config"
            # luci-i18n-samba4-zh-cn 不存在，追加到末尾
            echo "CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y" >> "$config"
          done
          
          echo "=== samba4 已添加 ==="
          grep "samba4" config/immortalwrt_config/X86.config | grep "=y"

      - name: Add Docker and Dockerman
        run: |
          # 为 X86 配置添加 Docker 支持
          config="config/immortalwrt_config/X86.config"
          
          # 以下配置存在于上游，用 sed 替换
          sed -i 's/# CONFIG_PACKAGE_docker is not set/CONFIG_PACKAGE_docker=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_dockerd is not set/CONFIG_PACKAGE_dockerd=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_luci-app-dockerman is not set/CONFIG_PACKAGE_luci-app-dockerman=y/' "$config"
          # luci-i18n-dockerman-zh-cn 不存在于上游配置，追加到末尾
          echo "CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y" >> "$config"
          
          echo "=== Docker 已添加 ==="
          grep -E "docker" "$config" | grep "=y" | head -10

      - name: Add QEMU virtualization support
        run: |
          # 为 X86 配置添加 QEMU 虚拟化支持
          config="config/immortalwrt_config/X86.config"
          
          # KVM 内核模块（存在于上游配置）
          sed -i 's/# CONFIG_PACKAGE_kmod-kvm-intel is not set/CONFIG_PACKAGE_kmod-kvm-intel=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_kmod-kvm-amd is not set/CONFIG_PACKAGE_kmod-kvm-amd=y/' "$config"
          # kmod-tun 上游已启用，无需处理
          
          # QEMU 相关（存在于上游配置）
          sed -i 's/# CONFIG_PACKAGE_qemu-x86_64-softmmu is not set/CONFIG_PACKAGE_qemu-x86_64-softmmu=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_qemu-bridge-helper is not set/CONFIG_PACKAGE_qemu-bridge-helper=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_qemu-img is not set/CONFIG_PACKAGE_qemu-img=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_qemu-keymaps is not set/CONFIG_PACKAGE_qemu-keymaps=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_qemu-firmware-efi is not set/CONFIG_PACKAGE_qemu-firmware-efi=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_qemu-firmware-seabios is not set/CONFIG_PACKAGE_qemu-firmware-seabios=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_qemu-firmware-seavgabios is not set/CONFIG_PACKAGE_qemu-firmware-seavgabios=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_qemu-firmware-pxe is not set/CONFIG_PACKAGE_qemu-firmware-pxe=y/' "$config"
          sed -i 's/# CONFIG_PACKAGE_virtio-console-helper is not set/CONFIG_PACKAGE_virtio-console-helper=y/' "$config"
          sed -i 's/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=2048/' "$config"
          
          echo "=== QEMU 已添加 ==="
          grep -E "qemu|kvm|virtio" "$config" | grep "=y" | head -15

      - name: Add shadow-utils (useradd/usermod/userdel)
        run: |
          # 为 X86 配置添加 shadow-utils 用户管理工具
          config="config/immortalwrt_config/X86.config"
          
          # 直接追加到配置文件末尾（make defconfig 会处理依赖）
          cat >> "$config" << 'EOF'
          
          # Shadow utils - user management tools
          CONFIG_PACKAGE_shadow-common=y
          CONFIG_PACKAGE_shadow-useradd=y
          CONFIG_PACKAGE_shadow-usermod=y
          CONFIG_PACKAGE_shadow-userdel=y
          CONFIG_PACKAGE_shadow-groupadd=y
          CONFIG_PACKAGE_shadow-groupmod=y
          CONFIG_PACKAGE_shadow-groupdel=y
          CONFIG_PACKAGE_shadow-passwd=y
          EOF
          
          echo "=== shadow-utils 已添加 ==="
          tail -10 "$config"

      - name: Add QEMU bridge config to diy script
        run: |
          # 在 diy-part2.sh 末尾添加 QEMU 桥接配置
          cat >> diy_script/immortalwrt_diy/diy-part2.sh << 'EOFQEMU'

          # Add QEMU bridge config
          mkdir -p files/etc/qemu
          echo "allow br-lan" > files/etc/qemu/bridge.conf
          EOFQEMU
          
          echo "=== QEMU 桥接配置已添加 ==="
          tail -5 diy_script/immortalwrt_diy/diy-part2.sh

      - name: Modify default IP to 172.16.0.253
        run: |
          # 修改 diy-part2.sh 中的默认 IP
          # 原: 192.168.1.1 -> 10.10.0.253
          # 改: 192.168.1.1 -> 172.16.0.253
          sed -i "s|sed -i 's/192.168.1.1/10.10.0.253/g'|sed -i 's/192.168.1.1/172.16.0.253/g'|" diy_script/immortalwrt_diy/diy-part2.sh
          
          echo "=== 默认 IP 已修改为 172.16.0.253 ==="
          grep "192.168.1.1" diy_script/immortalwrt_diy/diy-part2.sh

      - name: Fix workflow tokens
        run: |
          # 替换 token 名称
          sed -i 's/secrets\.MY_SECRET_PAT/secrets.X86OPENWRT/g' ".github/workflows/Build-OpenWrt_Multi-Platform(V5).yml"
          sed -i 's/secrets\.MY_SECRET_PAT/secrets.X86OPENWRT/g' .github/workflows/Update_Checker.yml 2>/dev/null || true
          
          # 修复 git pull 问题（强制推送后分支历史不一致）
          # 把 git pull origin ${{ github.ref_name }} 改成 git fetch + reset
          sed -i 's|git pull origin \${{ github.ref_name }}|git fetch origin \${{ github.ref_name }} \&\& git reset --hard origin/\${{ github.ref_name }}|g' ".github/workflows/Build-OpenWrt_Multi-Platform(V5).yml"
          
          # 删除重试失败任务的逻辑（因为我们删除了 Retry_Failure_Jobs.yml）
          sed -i '/gh workflow run Retry_Failure_Jobs.yml/d' ".github/workflows/Build-OpenWrt_Multi-Platform(V5).yml"
          
          # 删除 final-execution-jobs 整个 job（通知原作者仓库的，我们不需要）
          sed -i '/^  final-execution-jobs:/,/^  [a-zA-Z_-]*:/{ /^  final-execution-jobs:/d; /^  [a-zA-Z_-]*:/!d; }' ".github/workflows/Build-OpenWrt_Multi-Platform(V5).yml"
          # 如果 final-execution-jobs 是最后一个 job，用另一种方式删除
          sed -i '/^  final-execution-jobs:/,$d' ".github/workflows/Build-OpenWrt_Multi-Platform(V5).yml"

          # 只保留 bin/targets 固件产物，不再搬运整套包仓库到发布目录
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/Build-OpenWrt_Multi-Platform(V5).yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          start = "          mkdir -p feeds_packages"
          end = "          find . -mindepth 1 ! \\( -name '*-*-*' -o -name '*.zip' \\) -exec rm -rf {} +"

          if start in lines and end in lines:
              start_idx = lines.index(start)
              end_idx = lines.index(end, start_idx)
              lines[start_idx:end_idx + 1] = [
                  "          firmware_path=$PWD",
                  "          find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +",
                  "          find . -maxdepth 1 -type f ! -name '*-*-*' -delete",
              ]
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          # 主编译保留多线程，失败后只重跑 target/linux/install 的详细日志，避免 6 小时超时
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/Build-OpenWrt_Multi-Platform(V5).yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          anchor = '          echo "$(nproc) threads compile frimware"'
          end_prefix = '          echo "complie result'

          if anchor in lines:
              start_idx = lines.index(anchor) + 1
              end_idx = next(
                  i for i, line in enumerate(lines[start_idx:], start_idx)
                  if line.startswith(end_prefix)
              )
              lines[start_idx:end_idx] = [
                  "          set +e",
                  '          echo "Compile firmware with parallel jobs and save full log to artifact"',
                  '          make -j$(nproc) > "$GITHUB_WORKSPACE/compile_firmware.log" 2>&1 &',
                  "          build_pid=$!",
                  '          while kill -0 "$build_pid" 2>/dev/null; do',
                  "              echo \"$(date '+%F %T') parallel build still running...\"",
                  "              sleep 300",
                  "          done",
                  '          wait "$build_pid"',
                  "          is_complie_error=$?",
                  '          tail -n 200 "$GITHUB_WORKSPACE/compile_firmware.log" || true',
                  '          if [ "$is_complie_error" -ne 0 ]; then',
                  '              echo "Parallel build failed, rerun target/linux/install with -j1 V=s"',
                  '              make target/linux/install -j1 V=s > "$GITHUB_WORKSPACE/compile_target_install.log" 2>&1 &',
                  "              target_pid=$!",
                  '              while kill -0 "$target_pid" 2>/dev/null; do',
                  "                  echo \"$(date '+%F %T') target/linux/install still running...\"",
                  "                  sleep 300",
                  "              done",
                  '              wait "$target_pid"',
                  '              target_install_error=$?',
                  '              tail -n 200 "$GITHUB_WORKSPACE/compile_target_install.log" || true',
                  '              {',
                  '                  echo "==== compile_firmware.log tail ===="',
                  '                  tail -n 400 "$GITHUB_WORKSPACE/compile_firmware.log" || true',
                  '                  echo',
                  '                  echo "==== compile_target_install.log tail ===="',
                  '                  tail -n 400 "$GITHUB_WORKSPACE/compile_target_install.log" || true',
                  '                  echo',
                  '                  echo "==== target install exit code ===="',
                  '                  echo "$target_install_error"',
                  '                  echo',
                  '                  echo "==== matched error lines ===="',
                  '                  grep -nEi "ERROR:|error:|No space left|is too big|failed|cannot stat|\\*\\*\\*" "$GITHUB_WORKSPACE/compile_target_install.log" | tail -n 200 || true',
                  '              } > "$GITHUB_WORKSPACE/compile_error_excerpt.log"',
                  '              cat "$GITHUB_WORKSPACE/compile_error_excerpt.log" || true',
                  '          fi',
                  "          set -e",
                  "",
              ]
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          # 上传完整编译日志到 artifact，避免网页日志过长时看不到真正错误
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/Build-OpenWrt_Multi-Platform(V5).yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          anchor = "      - name: Check Space Usage"
          expr_open = "${" + "{"
          expr_close = "}" + "}"

          insert_block = [
              "      - name: Upload Compile Log",
              "        uses: actions/upload-artifact@v7",
              "        if: always() && steps.matrix_status.outputs.status != 'success'",
              "        with:",
              f"          name: compile_log_{expr_open} matrix.source_code_platform {expr_close}_{expr_open} matrix.platform {expr_close}",
              "          path: |",
              f"            {expr_open} github.workspace {expr_close}/compile_firmware.log",
              f"            {expr_open} github.workspace {expr_close}/compile_target_install.log",
              f"            {expr_open} github.workspace {expr_close}/compile_error_excerpt.log",
              "          if-no-files-found: ignore",
              "          retention-days: 5",
              "",
          ]

          if anchor in lines and "      - name: Upload Compile Log" not in lines:
              idx = lines.index(anchor)
              lines[idx:idx] = insert_block
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Set keep_latest releases to 3
        run: |
          # 修改保留 Release 数量为 3
          if [ -f .github/workflows/Update_Checker.yml ]; then
            sed -i 's/keep_latest: 10/keep_latest: 3/' .github/workflows/Update_Checker.yml
          fi
          echo "=== Release 保留数量已改为 3 ==="
          grep "keep_latest" .github/workflows/Update_Checker.yml || echo "未找到"

      - name: Commit and push
        run: |
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync upstream, keep immortalwrt only, add samba4"
            git push --force
          else
            echo "No changes"
          fi

      - name: Trigger build workflow
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type="openwrt_source_update"
        env:
          GH_TOKEN: ${{ secrets.X86OPENWRT }}
