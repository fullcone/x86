      - name: Harden generated workflows
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path


          WORKFLOWS = Path(".github/workflows")


          def gha(expression):
              return "${" + "{ " + expression + " }}"


          def require_file(path):
              if not path.is_file():
                  raise SystemExit(f"Required generated file is missing: {path}")
              return path.read_text(encoding="utf-8")


          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"Unable to patch {label}: expected anchor was not found")


          def add_concurrency(text, group):
              expected = f"  group: {group}"
              if expected in text:
                  return text
              marker = "\npermissions:\n"
              if marker not in text:
                  raise SystemExit("Unable to add concurrency: permissions block was not found")
              block = "\n".join([
                  "",
                  "concurrency:",
                  expected,
                  "  cancel-in-progress: false",
                  "",
                  "permissions:",
              ])
              return text.replace(marker, block + "\n", 1)


          def set_env_value(text, key, value):
              lines = text.splitlines()
              env_idx = lines.index("env:")
              end_idx = len(lines)
              for idx in range(env_idx + 1, len(lines)):
                  if lines[idx] and not lines[idx].startswith("  "):
                      end_idx = idx
                      break
              prefix = f"  {key}:"
              for idx in range(env_idx + 1, end_idx):
                  if lines[idx].startswith(prefix):
                      lines[idx] = f"  {key}: {value}"
                      return "\n".join(lines) + "\n"
              insert_idx = end_idx
              while insert_idx > env_idx + 1 and not lines[insert_idx - 1].strip():
                  insert_idx -= 1
              lines.insert(insert_idx, f"  {key}: {value}")
              return "\n".join(lines) + "\n"


          def set_job_timeout(text, job_name, minutes):
              lines = text.splitlines()
              try:
                  start = next(idx for idx, line in enumerate(lines) if line.strip() == f"{job_name}:")
              except StopIteration as exc:
                  raise SystemExit(f"Unable to set timeout: job {job_name} was not found") from exc
              end = len(lines)
              for idx in range(start + 1, len(lines)):
                  if lines[idx].startswith("  ") and not lines[idx].startswith("    ") and lines[idx].rstrip().endswith(":"):
                      end = idx
                      break
              for idx in range(start + 1, end):
                  if lines[idx].startswith("    timeout-minutes:"):
                      lines[idx] = f"    timeout-minutes: {minutes}"
                      return "\n".join(lines) + "\n"
              for idx in range(start + 1, end):
                  if lines[idx].startswith("    runs-on:"):
                      lines.insert(idx + 1, f"    timeout-minutes: {minutes}")
                      return "\n".join(lines) + "\n"
              raise SystemExit(f"Unable to set timeout: runs-on for {job_name} was not found")


          def remove_step_from_job(text, job_name, step_name):
              lines = text.splitlines()
              try:
                  job_start = next(idx for idx, line in enumerate(lines) if line.strip() == f"{job_name}:")
              except StopIteration as exc:
                  raise SystemExit(f"Unable to remove step: job {job_name} was not found") from exc
              job_end = len(lines)
              for idx in range(job_start + 1, len(lines)):
                  if lines[idx].startswith("  ") and not lines[idx].startswith("    ") and lines[idx].rstrip().endswith(":"):
                      job_end = idx
                      break
              marker = f"      - name: {step_name}"
              try:
                  step_start = next(idx for idx in range(job_start + 1, job_end) if lines[idx] == marker)
              except StopIteration:
                  return text
              step_end = job_end
              for idx in range(step_start + 1, job_end):
                  if lines[idx].startswith("      - name: "):
                      step_end = idx
                      break
              return "\n".join(lines[:step_start] + lines[step_end:]).rstrip() + "\n"


          def remove_job(text, job_name):
              lines = text.splitlines()
              marker = f"  {job_name}:"
              try:
                  job_start = lines.index(marker)
              except ValueError:
                  return text
              job_end = len(lines)
              job_pattern = re.compile(r"^  [A-Za-z0-9_-]+:\s*$")
              for idx in range(job_start + 1, len(lines)):
                  if job_pattern.match(lines[idx]):
                      job_end = idx
                      break
              return "\n".join(lines[:job_start] + lines[job_end:]).rstrip() + "\n"


          def insert_step_before_job_step(text, job_name, anchor_step_name, new_step_name, new_step_lines):
              lines = text.splitlines()
              job_marker = f"  {job_name}:"
              try:
                  job_start = lines.index(job_marker)
              except ValueError as exc:
                  raise SystemExit(f"Unable to insert {new_step_name}: job {job_name} was not found") from exc

              job_end = len(lines)
              job_pattern = re.compile(r"^  [A-Za-z0-9_-]+:\s*$")
              for idx in range(job_start + 1, len(lines)):
                  if job_pattern.match(lines[idx]):
                      job_end = idx
                      break

              new_step_marker = f"      - name: {new_step_name}"
              if new_step_marker in lines[job_start:job_end]:
                  return text

              anchor_marker = f"      - name: {anchor_step_name}"
              try:
                  anchor_idx = next(
                      idx for idx in range(job_start + 1, job_end)
                      if lines[idx] == anchor_marker
                  )
              except StopIteration as exc:
                  raise SystemExit(
                      f"Unable to insert {new_step_name}: anchor step {anchor_step_name} "
                      f"was not found in {job_name}"
                  ) from exc

              block = list(new_step_lines)
              if block and block[-1] != "":
                  block.append("")
              lines[anchor_idx:anchor_idx] = block
              return "\n".join(lines).rstrip() + "\n"


          def disable_persisted_checkout_credentials(text):
              lines = text.splitlines()
              index = 0
              while index < len(lines):
                  if not re.fullmatch(r"uses:\s+actions/checkout@\S+", lines[index].strip()):
                      index += 1
                      continue
                  indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
                  block_end = len(lines)
                  for idx in range(index + 1, len(lines)):
                      if lines[idx].startswith("      - name: ") or (
                          lines[idx].startswith("  ") and not lines[idx].startswith("    ")
                      ):
                          block_end = idx
                          break
                  if any(lines[idx].strip() == "persist-credentials: false" for idx in range(index + 1, block_end)):
                      index = block_end
                      continue
                  with_line = f"{indent}with:"
                  with_idx = next(
                      (idx for idx in range(index + 1, block_end) if lines[idx] == with_line),
                      None,
                  )
                  if with_idx is not None:
                      lines.insert(with_idx + 1, f"{indent}  persist-credentials: false")
                  else:
                      lines[index + 1:index + 1] = [with_line, f"{indent}  persist-credentials: false"]
                  index += 3
              return "\n".join(lines) + "\n"


          def ensure_maximize_build_diskspace(text):
              pinned_action = (
                  "smallprogram/maximize-build-diskspace@"
                  "d08bf8a34c868f82333a929be6be18a52cd89657"
              )
              action_pattern = re.compile(
                  r"(?m)^(\s*uses:\s*)smallprogram/maximize-build-diskspace@\S+\s*$"
              )
              if action_pattern.search(text):
                  return action_pattern.sub(
                      lambda match: f"{match.group(1)}{pinned_action}",
                      text,
                      count=1,
                  )

              if "      - name: Maximize Build Space" in text:
                  raise SystemExit(
                      "Maximize Build Space exists without the expected maximize-build-diskspace action"
                  )

              step = [
                  "      - name: Maximize Build Space",
                  "        if: steps.matrix_status.outputs.status != 'success'",
                  f"        uses: {pinned_action}",
                  "        with:",
                  "          root-reserve-mb: 3072",
                  "          swap-size-mb: 4096",
                  "          remove-dotnet: 'true'",
                  "          remove-android: 'true'",
                  "          remove-haskell: 'true'",
                  "          remove-codeql: 'true'",
                  "          remove-docker-images: 'true'",
                  "          build-mount-path: '/workdir'",
              ]
              return insert_step_before_job_step(
                  text,
                  "job_compile_and_upload",
                  "Free Disk Space",
                  "Maximize Build Space",
                  step,
              )


          def use_local_dependency_manifest(text):
              platform = gha("matrix.source_code_platform")
              old = f'          sudo -E apt-get -qq install $(curl -fsSL https://github.com/smallprogram/OpenWrtAction/raw/main/diy_script/{platform}_dependence)'
              new = "\n".join([
                  f'          dependency_file="$GITHUB_WORKSPACE/diy_script/{platform}_dependence"',
                  '          test -s "$dependency_file" || { echo "::error::Missing dependency manifest: $dependency_file"; exit 1; }',
                  '          read -r -a packages <<< "$(grep -Ev \'^[[:space:]]*(#|$)\' "$dependency_file" | xargs)"',
                  '          [ "${#packages[@]}" -gt 0 ] || { echo "::error::Dependency manifest is empty: $dependency_file"; exit 1; }',
                  '          sudo -E apt-get -qq install "${packages[@]}"',
              ])
              return replace_once(text, old, new, "local dependency manifest")


          shared_group = f"openwrt-repository-{gha('github.repository')}-{gha('github.ref')}"
          force_rebuild = gha("github.event_name == 'workflow_dispatch' && inputs.force_rebuild || github.event.client_payload.force_rebuild || false")

          build_path = None
          for name in ("Build_Multi_Platform(V6).yml", "Build-OpenWrt_Multi-Platform(V6).yml"):
              candidate = WORKFLOWS / name
              if candidate.is_file():
                  build_path = candidate
                  break
          if build_path is None:
              raise SystemExit("Generated V6 build workflow was not found")

          build = require_file(build_path)
          build = add_concurrency(build, shared_group)
          build = set_env_value(build, "FORCE_REBUILD", force_rebuild)
          build = use_local_dependency_manifest(build)
          build = ensure_maximize_build_diskspace(build)
          build = build.replace("github.event.inputs.force_rebuild != 'true'", "env.FORCE_REBUILD != 'true'")
          build = re.sub(r"(?m)^  actions: write.*$", "  actions: read", build, count=1)
          build = build.replace(
              '               echo "::warning::No cache chunks found in GHCR image."\n            fi',
              '               echo "::warning::No cache chunks found in GHCR image."\n               restore_failed=1\n            fi',
              1,
          )
          for job_name, step_name in (
              ("job_source_init", "Create temporary branch"),
              ("job_source_init", 'Merge and push changes with "theirs" strategy'),
              ("job_generate_release_tag", "Create temporary branch"),
              ("job_generate_release_tag", 'Merge and push changes with "theirs" strategy'),
          ):
              build = remove_step_from_job(build, job_name, step_name)

          dockerd_patch_step = [
              "      - name: Patch dockerd OpenWrt host bundle handling",
              "        run: |",
              "          set -euo pipefail",
              "          cd \"$GITHUB_WORKSPACE/openwrt\"",
              "          package_dir=\"feeds/packages/utils/dockerd\"",
              "          makefile=\"$package_dir/Makefile\"",
              "          if [ ! -f \"$makefile\" ]; then",
              "            echo \"::notice::dockerd feed package is not present; no host-bundle patch is needed.\"",
              "            exit 0",
              "          fi",
              "",
              "          patch_dir=\"$package_dir/patches\"",
              "          patch_file=\"$patch_dir/999-openwrt-skip-host-binaries.patch\"",
              "          if [ -d \"$patch_dir\" ] && grep -RqsE '^[+-][[:space:]]*copy_binaries \"\\$DEST\"' \"$patch_dir\"; then",
              "            echo \"dockerd feed already patches copy_binaries; keeping the upstream package patch.\"",
              "            exit 0",
              "          fi",
              "          mkdir -p \"$patch_dir\"",
              "",
              "          cat > \"$patch_file\" <<'PATCH'",
              "          --- a/hack/make/binary-daemon",
              "          +++ b/hack/make/binary-daemon",
              "          @@ -24,7 +24,7 @@",
              "           (",
              "           \tDOCKER_STATIC=1",
              "           \tGO_PACKAGE='github.com/moby/moby/v2/cmd/dockerd'",
              "           \tBINARY_NAME='dockerd'",
              "           \tsource \"${MAKEDIR}/.binary\"",
              "          -\tcopy_binaries \"$DEST\"",
              "          +\t: # FullCone/OpenWrt packages runtime helpers separately; never copy host binaries.",
              "           )",
              "          PATCH",
              "",
              "          grep -Fq 'never copy host binaries' \"$patch_file\"",
              "          dockerd_version=$(sed -n 's/^PKG_VERSION:=//p' \"$makefile\" | head -n 1)",
              "          echo \"Installed OpenWrt dockerd host-bundle patch for version ${dockerd_version:-unknown}.\"",
          ]
          build = insert_step_before_job_step(
              build,
              "job_source_init",
              "Make Defconfig Custom Configuration",
              "Patch dockerd OpenWrt host bundle handling",
              dockerd_patch_step,
          )
          build = disable_persisted_checkout_credentials(build)
          for job_name, timeout in (
              ("job_init", 15),
              ("job_source_init", 90),
              ("job_generate_release_tag", 30),
              ("job_compile_and_upload", 360),
              ("job_build_x86_installer_iso", 45),
              ("job_organize_tags", 45),
          ):
              build = set_job_timeout(build, job_name, timeout)

          build = remove_job(build, "job_fullcone_auto_retry")
          auto_retry_template = r'''job_fullcone_auto_retry:
            needs: [job_init, job_source_init, job_generate_release_tag, job_compile_and_upload, job_build_x86_installer_iso, job_organize_tags]
            if: @@ always() && fromJSON(github.run_attempt) < 3 @@
            runs-on: ubuntu-latest
            timeout-minutes: 10
            name: Schedule-Automatic-Retry
            permissions:
              actions: write
              contents: read
            steps:
              - name: Detect retryable jobs
                env:
                  GH_TOKEN: @@ github.token @@
                  GH_REPO: @@ github.repository @@
                  TARGET_RUN_ID: @@ github.run_id @@
                  TARGET_ATTEMPT: @@ github.run_attempt @@
                  TARGET_REF: @@ github.ref_name @@
                run: |
                  set -euo pipefail
                  jobs_endpoint="/repos/$GH_REPO/actions/runs/$TARGET_RUN_ID/attempts/$TARGET_ATTEMPT/jobs?per_page=100"
                  problem_jobs="$(
                    gh api --paginate "$jobs_endpoint" | jq -r '
                      def runtime_seconds:
                        if (.started_at != null and .completed_at != null) then
                          try (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor) catch 0
                        else 0 end;
                      .jobs[]
                      | select(.name != "Schedule-Automatic-Retry")
                      | runtime_seconds as $runtime
                      | select(
                          .conclusion == "failure"
                          or .conclusion == "timed_out"
                          or (.conclusion == "cancelled" and $runtime >= 21000)
                        )
                      | [.name, .conclusion, ($runtime | tostring)]
                      | @tsv'
                  )"

                  if [ -z "$problem_jobs" ]; then
                    echo "No failed, timed-out, or timeout-like cancelled jobs need an automatic retry."
                    exit 0
                  fi

                  echo "The following jobs require another attempt:"
                  printf '%s\n' "$problem_jobs"
                  {
                    echo "### Automatic retry scheduled"
                    echo
                    echo '```text'
                    printf '%s\n' "$problem_jobs"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

                  gh workflow run Retry_Failure_Jobs.yml \
                    --ref "$TARGET_REF" \
                    -F run_id="$TARGET_RUN_ID" \
                    -F expected_attempt="$TARGET_ATTEMPT"
          '''
          auto_retry_job = re.sub(
              r"@@ (.*?) @@",
              lambda match: gha(match.group(1)),
              auto_retry_template,
          )
          auto_retry_job = "\n".join(
              f"  {line}" if line else ""
              for line in auto_retry_job.splitlines()
          )
          build = build.rstrip() + "\n\n" + auto_retry_job.rstrip() + "\n"
          build_path.write_text(build, encoding="utf-8")

          retry_path = WORKFLOWS / "Retry_Failure_Jobs.yml"
          retry_template = r'''# Automatic build retry generated and maintained by sync_upstream.yml
          name: Retry_Failure_Jobs

          on:
            workflow_dispatch:
              inputs:
                run_id:
                  description: 'Build workflow run ID to retry'
                  required: true
                  type: string
                expected_attempt:
                  description: 'Build attempt that requested this retry'
                  required: true
                  type: string

          permissions:
            actions: write
            contents: read

          concurrency:
            group: automatic-build-retry-@@ inputs.run_id @@
            cancel-in-progress: false

          jobs:
            rerun:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - name: Validate target and rerun
                  env:
                    GH_TOKEN: @@ github.token @@
                    GH_REPO: @@ github.repository @@
                    TARGET_RUN_ID: @@ inputs.run_id @@
                    EXPECTED_ATTEMPT: @@ inputs.expected_attempt @@
                  run: |
                    set -euo pipefail
                    if [[ ! "$TARGET_RUN_ID" =~ ^[0-9]+$ ]]; then
                      echo "::error::Invalid workflow run ID: $TARGET_RUN_ID"
                      exit 1
                    fi
                    if [[ ! "$EXPECTED_ATTEMPT" =~ ^[0-9]+$ ]]; then
                      echo "::error::Invalid expected attempt: $EXPECTED_ATTEMPT"
                      exit 1
                    fi

                    run_endpoint="/repos/$GH_REPO/actions/runs/$TARGET_RUN_ID"
                    run_json="$(gh api "$run_endpoint")"
                    attempt="$(jq -r '.run_attempt' <<< "$run_json")"
                    if [[ ! "$attempt" =~ ^[0-9]+$ ]]; then
                      echo "::error::Unable to determine the current run attempt."
                      exit 1
                    fi
                    if [ "$attempt" -ne "$EXPECTED_ATTEMPT" ]; then
                      echo "::notice::Ignoring stale retry request for attempt $EXPECTED_ATTEMPT; current attempt is $attempt."
                      exit 0
                    fi

                    workflow_path="$(jq -r '.path // empty' <<< "$run_json")"
                    case "$workflow_path" in
                      '.github/workflows/Build_Multi_Platform(V6).yml'|'.github/workflows/Build-OpenWrt_Multi-Platform(V6).yml') ;;
                      *)
                        echo "::error::Refusing to rerun unexpected workflow: $workflow_path"
                        exit 1
                        ;;
                    esac

                    if [ "$(jq -r '.status' <<< "$run_json")" != "completed" ]; then
                      echo "Waiting for build run $TARGET_RUN_ID to complete..."
                      gh run watch "$TARGET_RUN_ID" --exit-status || true
                    fi

                    run_json="$(gh api "$run_endpoint")"
                    attempt="$(jq -r '.run_attempt' <<< "$run_json")"
                    if [[ ! "$attempt" =~ ^[0-9]+$ ]]; then
                      echo "::error::Unable to determine the current run attempt."
                      exit 1
                    fi
                    if [ "$attempt" -ne "$EXPECTED_ATTEMPT" ]; then
                      echo "::notice::Ignoring stale retry request for attempt $EXPECTED_ATTEMPT; current attempt is $attempt."
                      exit 0
                    fi
                    if [ "$attempt" -ge 3 ]; then
                      echo "::notice::Maximum of two automatic retries reached for run $TARGET_RUN_ID."
                      exit 0
                    fi

                    jobs_endpoint="/repos/$GH_REPO/actions/runs/$TARGET_RUN_ID/attempts/$attempt/jobs?per_page=100"
                    problem_jobs="$(
                      gh api --paginate "$jobs_endpoint" | jq -r '
                        def runtime_seconds:
                          if (.started_at != null and .completed_at != null) then
                            try (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor) catch 0
                          else 0 end;
                        .jobs[]
                        | select(.name != "Schedule-Automatic-Retry")
                        | runtime_seconds as $runtime
                        | select(
                            .conclusion == "failure"
                            or .conclusion == "timed_out"
                            or (.conclusion == "cancelled" and $runtime >= 21000)
                          )
                        | [.name, .conclusion, ($runtime | tostring)]
                        | @tsv'
                    )"

                    if [ -z "$problem_jobs" ]; then
                      echo "No failed, timed-out, or timeout-like cancelled jobs remain."
                      exit 0
                    fi

                    echo "Retrying build run $TARGET_RUN_ID after attempt $attempt:"
                    printf '%s\n' "$problem_jobs"
                    if awk -F '\t' '$2 == "cancelled" || $2 == "timed_out" { found=1 } END { exit(found ? 0 : 1) }' <<< "$problem_jobs"; then
                      echo "A timed-out or timeout-like cancelled job requires a full rerun. Successful matrix builds will be skipped by matrix_job_status.sh."
                      gh run rerun "$TARGET_RUN_ID"
                    else
                      gh run rerun "$TARGET_RUN_ID" --failed
                    fi
          '''
          retry_template = re.sub(
              r"@@ (.*?) @@",
              lambda match: gha(match.group(1)),
              retry_template,
          )
          retry_path.write_text(retry_template.lstrip().rstrip() + "\n", encoding="utf-8")

          update_path = WORKFLOWS / "Update_Checker.yml"
          update_template = r'''# Source update checker generated and maintained by sync_upstream.yml
          name: Update_Checker

          on:
            repository_dispatch:
              types: [openwrt_update_check_v1]
            workflow_dispatch:
              inputs:
                force_rebuild:
                  description: 'Trigger a clean build even when source hashes are unchanged'
                  required: false
                  type: boolean
                  default: false
            schedule:
              - cron: '30 2 * * *'

          permissions:
            contents: write
            actions: read

          concurrency:
            group: update-checker-@@ github.repository @@-@@ github.ref @@
            cancel-in-progress: false

          jobs:
            check:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Checkout
                  uses: actions/checkout@v6
                  with:
                    persist-credentials: false

                - name: Resolve source state
                  id: source_hash
                  env:
                    FC_TOKEN: @@ secrets.X86OPENWRT @@
                  run: |
                    set -euo pipefail
                    chmod +x compile_script/update_checker.sh
                    "$GITHUB_WORKSPACE/compile_script/update_checker.sh"

                - name: Restore source state
                  id: source_state
                  uses: actions/cache@v5
                  with:
                    path: .source-state
                    key: source-state-@@ steps.source_hash.outputs.FINAL_HASH @@

                - name: Save source state
                  if: steps.source_state.outputs.cache-hit != 'true'
                  env:
                    HASH_STRING: @@ steps.source_hash.outputs.HASH_STRING @@
                  run: printf '%s\n' "$HASH_STRING" > .source-state

                - name: Trigger firmware build
                  if: steps.source_state.outputs.cache-hit != 'true' || inputs.force_rebuild || github.event.client_payload.force_rebuild == 'true'
                  env:
                    GH_TOKEN: @@ github.token @@
                    FORCE_REBUILD: @@ inputs.force_rebuild || github.event.client_payload.force_rebuild || false @@
                    CURRENT_SHA: @@ github.sha @@
                    BUILD_WORKFLOW_PATH: .github/workflows/Build_Multi_Platform(V6).yml
                  run: |
                    set -euo pipefail

                    if [ "$FORCE_REBUILD" != "true" ]; then
                      workflows_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"
                      build_workflow_id="$(
                        jq -r --arg path "$BUILD_WORKFLOW_PATH" \
                          '.workflows[] | select(.path == $path) | .id' \
                          <<< "$workflows_json" | sed -n '1p'
                      )"
                      if [ -z "$build_workflow_id" ]; then
                        echo "::error::Unable to locate $BUILD_WORKFLOW_PATH for duplicate-build detection."
                        exit 1
                      fi

                      active_build="$(
                        gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$build_workflow_id/runs?head_sha=$CURRENT_SHA&per_page=20" \
                          --jq '[.workflow_runs[] | select(.status != "completed")][0]
                            | if . == null then empty else [.id, .status, .html_url] | @tsv end'
                      )"
                      if [ -n "$active_build" ]; then
                        IFS=$'\t' read -r active_run_id active_status active_url <<< "$active_build"
                        echo "::notice::Build run $active_run_id is already $active_status for $CURRENT_SHA; skipping duplicate dispatch."
                        echo "Existing build: $active_url"
                        exit 0
                      fi
                    fi

                    jq -n --arg force_rebuild "$FORCE_REBUILD" \
                      '{event_type: "openwrt_source_update_v6", client_payload: {force_rebuild: $force_rebuild}}' \
                      | gh api --method POST "/repos/$GITHUB_REPOSITORY/dispatches" --input -
          '''
          update_template = re.sub(
              r"@@ (.*?) @@",
              lambda match: gha(match.group(1)),
              update_template,
          )
          update_text = update_template.lstrip()
          update_path.write_text(update_text.rstrip() + "\n", encoding="utf-8")

          update_script_path = Path("compile_script/update_checker.sh")
          update_script = r'''#!/usr/bin/env bash
          set -Eeuo pipefail

          report_unexpected_failure() {
            local status="$?"
            local line="$1"
            local command="$2"
            trap - ERR
            echo "::error::Unexpected source-state failure at line $line (exit $status): $command" >&2
            exit "$status"
          }
          trap 'report_unexpected_failure "$LINENO" "$BASH_COMMAND"' ERR

          source "$GITHUB_WORKSPACE/compile_script/main_and_feeds_url.sh"

          mapfile -t unique_repositories < <(printf '%s\n' "${all_REPO_URLS[@]}" | awk 'NF' | sort -u)
          if [ "${#unique_repositories[@]}" -eq 0 ]; then
            echo "::error::No source repositories were discovered."
            exit 1
          fi

          resolve_remote_commit() {
            local repository="$1"
            local ref="$2"
            local display_repository="${3:-$repository}"
            local max_attempts=3
            local attempt=1
            local delay_seconds
            local output
            local status
            local reason
            local -a matching_commits

            while [ "$attempt" -le "$max_attempts" ]; do
              if output="$(GIT_TERMINAL_PROMPT=0 timeout 30s git ls-remote "$repository" "$ref" 2>&1)"; then
                status=0
              else
                status=$?
              fi

              # Git may print a redirect warning before the actual ref record.
              # Ignore diagnostics, require the requested ref, and reject ambiguity.
              mapfile -t matching_commits < <(
                awk -v ref="$ref" 'NF == 2 && length($1) == 40 && $1 !~ /[^0-9a-fA-F]/ &&
                  ($2 == ref || $2 == "refs/heads/" ref || $2 == "refs/tags/" ref) {print tolower($1)}' \
                  <<< "$output" | sort -u
              )
              if [ "$status" -eq 0 ] && [ "${#matching_commits[@]}" -eq 1 ]; then
                printf '%s\n' "${matching_commits[0]}"
                return 0
              fi

              if [ "$status" -eq 0 ]; then
                reason="no matching 40-character commit"
              else
                reason="git exit $status"
              fi
              echo "::warning::Unable to resolve $display_repository at $ref (attempt $attempt/$max_attempts: $reason)" >&2
              if [ -n "$output" ]; then
                printf '%s\n' "$output" \
                  | sed -E 's#https://[^/@[:space:]]+:[^/@[:space:]]+@github\.com/#https://github.com/#g' \
                  | tail -n 3 \
                  | sed 's/^/  /' >&2
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                delay_seconds=$((attempt * 2))
                sleep "$delay_seconds"
              fi
              attempt=$((attempt + 1))
            done

            return 1
          }

          failures=0
          records=()
          for entry in "${unique_repositories[@]}"; do
            read -r repository branch <<< "$entry"
            ref="${branch:-HEAD}"
            echo "Checking $repository ($ref)"
            if commit="$(resolve_remote_commit "$repository" "$ref")"; then
              records+=("${repository}@${ref}=${commit}")
            else
              echo "::error::Unable to resolve $repository at $ref after 3 attempts."
              failures=$((failures + 1))
            fi
          done

          if [ -z "${FC_TOKEN:-}" ]; then
            echo "::error::X86OPENWRT is required to inspect the private FullConeFlow source."
            failures=$((failures + 1))
          else
            echo "::add-mask::$FC_TOKEN"
            fullcone_repository="https://x-access-token:${FC_TOKEN}@github.com/fullcone/fullcone-flow.git"
            echo "::add-mask::$fullcone_repository"
            echo "Private source token is present; using authenticated Git transport."
            if fullcone_commit="$(resolve_remote_commit \
              "$fullcone_repository" \
              HEAD \
              "https://github.com/fullcone/fullcone-flow.git")"; then
              records+=("https://github.com/fullcone/fullcone-flow.git@HEAD=${fullcone_commit}")
            else
              echo "::error::Unable to resolve the private fullcone/fullcone-flow source after 3 attempts."
              failures=$((failures + 1))
            fi
            unset fullcone_repository
          fi

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures source repository checks failed; refusing to publish a partial state."
            exit 1
          fi

          HASH_STRING="$(printf '%s\n' "${records[@]}" | sort | tr '\n' '|')"
          FINAL_HASH="$(printf '%s' "$HASH_STRING" | sha256sum | awk '{print $1}')"
          echo "Resolved ${#records[@]} repositories"
          echo "Final source state: $FINAL_HASH"
          echo "FINAL_HASH=$FINAL_HASH" >> "$GITHUB_OUTPUT"
          echo "HASH_STRING=$HASH_STRING" >> "$GITHUB_OUTPUT"
          '''
          update_script = "\n".join(line[10:] if line.startswith("          ") else line for line in update_script.splitlines()).lstrip()
          update_script_path.write_text(update_script.rstrip() + "\n", encoding="utf-8")

          repo_list_path = Path("compile_script/main_and_feeds_url.sh")
          repo_list = require_file(repo_list_path)
          repo_marker = 'all_REPO_URLS+=("${feeds_REPO_URLS[@]}")'
          custom_repo_marker = 'all_REPO_URLS+=("${custompackages_REPO_URLS[@]}")'
          if custom_repo_marker not in repo_list:
              repo_list = replace_once(
                  repo_list,
                  repo_marker,
                  "\n".join((repo_marker, custom_repo_marker)),
                  "custom package update tracking",
              )
          repo_list_path.write_text(repo_list, encoding="utf-8")

          print("Hardened automatic Build, Retry, and Update Checker workflows")
          PY

      - name: Cache x86 Rust compiler in base checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/Build_Multi_Platform(V6).yml')
          text = path.read_text(encoding='utf-8')
          marker = '# fullcone cache x86 Rust host compiler'
          if marker not in text:
              pattern = r'(          LONG_TIME_TARGETS_COMPILE=\(.*?\n          \)\n)'
              matches = list(re.finditer(pattern, text, re.S))
              if len(matches) != 1:
                  raise SystemExit('base compile target array is missing or ambiguous')
              matrix_platform = '${' + '{ matrix.platform }}'
              block = '\n'.join([
                  '          # fullcone cache x86 Rust host compiler',
                  f'          case "{matrix_platform}" in',
                  '            X86|X86_AllImages|X86_VMware)',
                  '              LONG_TIME_TARGETS_COMPILE+=("package/feeds/packages/rust/host/compile")',
                  '              ;;',
                  '          esac',
                  '',
              ])
              match = matches[0]
              text = text[:match.end()] + block + text[match.end():]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Diagnose and retry base toolchain failure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/Build_Multi_Platform(V6).yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '      - name: Compile Base (Tools, Toolchain, Kernel, LongTime Packages)'
          end_marker = '      - name: Checkpoint Cache (Save Base to GHCR)'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('base compilation step anchors are missing or ambiguous')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          step = text[start:end]
          marker = '# fullcone bounded base toolchain diagnostic retry'
          if marker not in step:
              platform = '${' + '{ matrix.platform }}'
              helper = '\n'.join([
                  '          # fullcone bounded base toolchain diagnostic retry',
                  '          run_base_target() {',
                  '            local target="$1"',
                  '            shift',
                  '            local log="$GITHUB_WORKSPACE/base-build-${target//\\//-}.log"',
                  '            if make "$target" -j$(nproc) "$@" > "$log" 2>&1; then',
                  '              tail -20 "$log"',
                  '              return 0',
                  '            fi',
                  '            tail -120 "$log"',
                  '            [ "$target" = toolchain/compile ] || return 1',
                  f'            case "{platform}" in',
                  '              X86|X86_AllImages|X86_VMware) ;;',
                  '              *) return 1 ;;',
                  '            esac',
                  '            echo "::notice::Retrying failed toolchain once with -j1 V=s"',
                  '            if make "$target" -j1 V=s >> "$log" 2>&1; then',
                  '              tail -40 "$log"',
                  '              echo "::notice::Toolchain completed successfully on serial retry"',
                  '              return 0',
                  '            fi',
                  '            tail -120 "$log"',
                  '            return 1',
                  '          }',
                  '',
              ])
              anchor = '          LONG_TIME_TARGETS_COMPILE=('
              if step.count(anchor) != 1:
                  raise SystemExit('base compile target array is missing or ambiguous')
              step = step.replace(anchor, helper + anchor, 1)
              commands = {
                  'time make $target -j$(nproc) V=s || exit 1': 'time run_base_target "$target" V=s || exit 1',
                  'time make $target -j$(nproc) || exit 1': 'time run_base_target "$target" || exit 1',
              }
              for old, new in commands.items():
                  if step.count(old) != 1:
                      raise SystemExit(f'base compile invocation missing or ambiguous: {old}')
                  step = step.replace(old, new, 1)
              source = '${' + '{ matrix.source_code_platform }}'
              platform = '${' + '{ matrix.platform }}'
              upload = '\n'.join([
                  '      - name: Upload Base Compilation Diagnostics',
                  "        if: always() && steps.matrix_status.outputs.status != 'success' && !cancelled()",
                  '        uses: actions/upload-artifact@v7',
                  '        with:',
                  f'          name: base_build_logs_{source}_{platform}',
                  "          path: ${" + '{ github.workspace }}/base-build-*.log',
                  '          if-no-files-found: ignore',
                  '          retention-days: 7',
                  '',
              ])
              text = text[:start] + step + upload + text[end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Repair build integrity and ISO recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          MARK = '# fullcone reliability 20261016'
          def replace(s, old, new):
              if s.count(old) != 1:
                  raise SystemExit('Expected one anchor: ' + old[:100])
              return s.replace(old, new, 1)
          def step(s, name, callback):
              pattern = r'^      - name: ' + re.escape(name) + r'\n.*?(?=^      - name: |^  [A-Za-z_][A-Za-z_0-9-]*:|\Z)'
              matches = list(re.finditer(pattern, s, re.M | re.S))
              if len(matches) != 1:
                  raise SystemExit('Expected one step: ' + name)
              m = matches[0]
              return s[:m.start()] + callback(m.group()) + s[m.end():]
          def change(path, callback):
              p = Path(path)
              s = p.read_text(encoding='utf8')
              if MARK not in s:
                  p.write_text(callback(s), encoding='utf8')

          RECOVERY = r'''set -euo pipefail
          python3 - <<'RECOVER'
          import hashlib,json,os,re,urllib.request,urllib.parse
          from pathlib import Path
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):
                  result=super().redirect_request(req,fp,code,msg,headers,url)
                  if result and urllib.parse.urlparse(req.full_url).netloc!=urllib.parse.urlparse(url).netloc:
                      result.remove_header('Authorization')
                  return result
          urllib.request.install_opener(urllib.request.build_opener(Redirect()))
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'fullcone-recovery'}
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          run=os.environ['GITHUB_RUN_ID']
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(api+path,headers=headers),timeout=60) as r: return json.load(r)
          name='immortalwrt-x86-64-generic-ext4-combined-efi.img.gz'
          record=None
          # Resolve THIS run's earlier successful standard-X86 upload, never latest.
          for attempt in range(int(os.environ['GITHUB_RUN_ATTEMPT'])-1,0,-1):
              for job in get(f'/actions/runs/{run}/attempts/{attempt}/jobs?per_page=100')['jobs']:
                  if job['name']!='Build-immortalwrt-X86': continue
                  if not any(s['name']=='Upload Firmware To Release Directly' and s['conclusion']=='success' for s in job.get('steps',[])): continue
                  with urllib.request.urlopen(urllib.request.Request(api+f"/actions/jobs/{job['id']}/logs",headers=headers),timeout=60) as r:
                      logs=r.read().decode('utf-8-sig')
                  tags=set(re.findall(r'multi-platform_\d{4}\.\d{2}\.\d{2}_\d{2}\.\d{2}\.\d{2}',logs))
                  if len(tags)!=1: raise SystemExit('Ambiguous same-run source release tag')
                  tag=tags.pop()
                  assets=[a for a in get('/releases/tags/'+urllib.parse.quote(tag,safe=''))['assets'] if a['name']==name]
                  if len(assets)!=1 or not re.fullmatch(r'sha256:[0-9a-f]{64}',assets[0].get('digest') or ''): raise SystemExit('Missing unique asset or SHA256')
                  record=(tag,assets[0]); break
              if record: break
          if not record: raise SystemExit('No earlier successful standard X86 upload in this run')
          tag,asset=record
          destination=Path('firmware')/name
          destination.parent.mkdir(exist_ok=True)
          temporary=destination.with_suffix('.download')
          h=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(asset['browser_download_url'],headers=headers),timeout=60) as r,temporary.open('wb') as f:
              for data in iter(lambda:r.read(1024*1024),b''): h.update(data); f.write(data)
          if h.hexdigest()!=asset['digest'][7:] or temporary.stat().st_size!=asset['size']:
              temporary.unlink(); raise SystemExit('Recovered firmware SHA256/size mismatch')
          temporary.replace(destination)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('source_tag='+tag+'\n')
          print(f'Verified same-run payload: run={run} source_release={tag} sha256={h.hexdigest()}')
          RECOVER'''

