name: Isolated RAID1 ISO Validation
run-name: RAID1 ISO isolated validation (Ubuntu 24.04)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  raid1_iso_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Checkout ISO integrity helpers
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Download and verify released X86 fixture
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p firmware
        name=immortalwrt-x86-64-generic-ext4-combined-efi.img.gz
        curl --fail --location --retry 3 --max-time 300 --output "firmware/$name" "https://github.com/fullcone/x86/releases/download/multi-platform_2026.11.19_18.31.05/$name"
        printf '%s  %s\n' ee51fda05f675f1c24f11c7c9f5114f864f931527f6e08535280b0eed2288667 "firmware/$name" | sha256sum --check
    - name: Build X86 Installer ISO
      id: build_x86_installer_iso
      env:
        FIRMWARE_DIR: ${{ github.workspace }}/firmware
        ISO_OUTPUT_DIR: ${{ github.workspace }}/installer-output
      run: "set -euo pipefail\n\nmkdir -p \"$ISO_OUTPUT_DIR\"\ncd \"$FIRMWARE_DIR\"\npayload=\"$(find . -maxdepth 1 -type f -name 'immortalwrt-x86-64-generic-ext4-combined-efi.img.gz'\
        \ -print -quit)\"\nif [ -z \"$payload\" ]; then\n  echo \"::error::未找到 X86 ext4 EFI combined 镜像，无法生成 true mdadm RAID1 installer ISO\"\n  ls -lah\n  exit 1\n\
        fi\npayload=\"${payload#./}\"\npayload_name=\"$(basename \"$payload\")\"\niso_name=\"${payload_name%.img.gz}-mdadm-raid1-installer.iso\"\necho \"Using payload:\
        \ $payload_name\"\necho \"Installer ISO: $iso_name\"\n\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends busybox-static cpio gzip kbd\
        \ kmod grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools mdadm parted dosfstools gdisk e2fsprogs file binutils zstd\ndf -h / /tmp \"$RUNNER_TEMP\"\
        \ || true\ngeneric_kernel_pkg=\"$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9].*-generic/ {print $2; exit}')\"\nif [ -n \"$generic_kernel_pkg\"\
        \ ]; then\n  generic_kernel_version=\"${generic_kernel_pkg#linux-image-}\"\n  sudo apt-get install -y --no-install-recommends \"$generic_kernel_pkg\" \"linux-modules-extra-$generic_kernel_version\"\
        \n  df -h / /tmp \"$RUNNER_TEMP\" || true\nelse\n  echo \"::warning::Cannot resolve linux-image-generic target; falling back to runner kernel\"\nfi\nsudo\
        \ apt-get clean\n\ninstaller_script=\"$RUNNER_TEMP/build_mdraid_installer_iso.sh\"\ncat > \"$installer_script\" <<'MDRAID_INSTALLER_SCRIPT'\n#!/usr/bin/env\
        \ bash\nset -euo pipefail\n\nif [[ $# -lt 1 ]]; then\n  echo \"Usage: $0 <openwrt-x86-combined-efi.img.gz> [output-dir]\" >&2\n  exit 2\nfi\n\nPAYLOAD=\"\
        $1\"\nOUTDIR=\"${2:-$(dirname \"$PAYLOAD\")}\"\nGPT_HELPER=\"$3\"\n\nif [[ ! -f \"$PAYLOAD\" ]]; then\n  echo \"Payload not found: $PAYLOAD\" >&2\n  exit\
        \ 1\nfi\n\nmkdir -p \"$OUTDIR\"\npayload_name=\"$(basename \"$PAYLOAD\")\"\niso_name=\"${payload_name%.img.gz}-mdadm-raid1-installer.iso\"\niso_path=\"$OUTDIR/$iso_name\"\
        \n\nrequired_tools=(\n  awk basename busybox cpio depmod e2fsck file find gzip ldd mdadm mkfs.vfat\n  loadkeys modinfo mount partprobe readelf resize2fs sgdisk\
        \ sha256sum umount xorriso\n  grub-mkrescue grub-mkstandalone zstd\n)\nfor tool in \"${required_tools[@]}\"; do\n  if ! command -v \"$tool\" >/dev/null 2>&1;\
        \ then\n    echo \"Missing required tool: $tool\" >&2\n    exit 1\n  fi\ndone\n\nworkdir=\"$(mktemp -d)\"\ncleanup() {\n  set +e\n  umount \"$workdir/src_root\"\
        \ \"$workdir/src_boot\" 2>/dev/null\n  rm -rf \"$workdir\"\n}\ntrap cleanup EXIT\n\niso_root=\"$workdir/iso\"\ninstaller_root=\"$workdir/installer-initramfs\"\
        \nraid_root=\"$workdir/raid-initramfs\"\nsrc_root=\"$workdir/src_root\"\nsrc_boot=\"$workdir/src_boot\"\nsrc_img=\"$workdir/openwrt.img\"\n\nmkdir -p \"$iso_root/boot/grub\"\
        \ \"$iso_root/payload\" \"$installer_root\" \"$raid_root\" \"$src_root\" \"$src_boot\"\n# fullcone target GPT and checked installation 20261018\nmkdir -p\
        \ \"$installer_root/sbin\"\ngcc -O2 -Wall -Wextra -Werror -static \"$(dirname \"$GPT_HELPER\")/fullcone_target_gpt.c\" -o \"$installer_root/sbin/fullcone-target-gpt\"\
        \n\necho \"Decompressing payload for metadata extraction...\"\ngzip -dc \"$PAYLOAD\" > \"$src_img\"\npython3 \"$GPT_HELPER\" \"$src_img\"\n\npart_start()\
        \ {\n  local part=\"$1\"\n  sgdisk -i \"$part\" \"$src_img\" | awk -F: '/First sector/ {gsub(/^[ \\t]+|[ \\t]+$/, \"\", $2); split($2, a, /[ \\t]+/); print\
        \ a[1]; exit}'\n}\n\npart_end() {\n  local part=\"$1\"\n  sgdisk -i \"$part\" \"$src_img\" | awk -F: '/Last sector/ {gsub(/^[ \\t]+|[ \\t]+$/, \"\", $2);\
        \ split($2, a, /[ \\t]+/); print a[1]; exit}'\n}\n\nboot_start=\"$(part_start 1)\"\nboot_end=\"$(part_end 1)\"\nroot_start=\"$(part_start 2)\"\nroot_end=\"\
        $(part_end 2)\"\nboot_size=\"$(((boot_end - boot_start + 1) * 512))\"\nroot_size=\"$(((root_end - root_start + 1) * 512))\"\n\nmount -o ro,loop,offset=\"\
        $((boot_start * 512))\",sizelimit=\"$boot_size\" \"$src_img\" \"$src_boot\"\nmount -o ro,loop,offset=\"$((root_start * 512))\",sizelimit=\"$root_size\" \"\
        $src_img\" \"$src_root\"\n\nopenwrt_kernel_version=\"$(find \"$src_root/lib/modules\" -mindepth 1 -maxdepth 1 -type d -printf '%f\\n' | sort -V | tail -n\
        \ 1)\"\nif [[ -z \"$openwrt_kernel_version\" ]]; then\n  echo \"Cannot find OpenWrt kernel module version.\" >&2\n  exit 1\nfi\n\ncopy_binary_with_libs()\
        \ {\n  local bin=\"$1\"\n  local root=\"$2\"\n  local dest\n\n  if [[ ! -x \"$bin\" ]]; then\n    echo \"Binary not executable: $bin\" >&2\n    exit 1\n \
        \ fi\n\n  dest=\"$root$bin\"\n  mkdir -p \"$(dirname \"$dest\")\"\n  cp -L \"$bin\" \"$dest\"\n\n  ldd \"$bin\" 2>/dev/null | while read -r line; do\n   \
        \ local lib\n    lib=\"$(printf '%s\\n' \"$line\" | awk '\n      /=> \\// {print $3; next}\n      /^\\// {print $1; next}\n    ')\"\n    [[ -n \"${lib:-}\"\
        \ && -e \"$lib\" ]] || continue\n    mkdir -p \"$root$(dirname \"$lib\")\"\n    cp -L \"$lib\" \"$root$lib\"\n  done\n\n  local interp\n  interp=\"$(readelf\
        \ -l \"$bin\" 2>/dev/null | awk -F': ' '/interpreter/ {gsub(/]$/, \"\", $2); print $2; exit}')\"\n  if [[ -n \"${interp:-}\" && -e \"$interp\" ]]; then\n\
        \    mkdir -p \"$root$(dirname \"$interp\")\"\n    cp -L \"$interp\" \"$root$interp\"\n  fi\n}\n\ncopy_openwrt_binary_with_libs() {\n  local rel=\"$1\"\n\
        \  local root=\"$2\"\n  local src=\"$src_root$rel\"\n  local dest=\"$root$rel\"\n\n  mkdir -p \"$(dirname \"$dest\")\"\n  cp -L \"$src\" \"$dest\"\n\n  readelf\
        \ -d \"$src\" 2>/dev/null | awk -F'[][]' '/NEEDED/ {print $2}' | while read -r lib; do\n    [[ -n \"$lib\" ]] || continue\n    if [[ -e \"$src_root/lib/$lib\"\
        \ ]]; then\n      mkdir -p \"$root/lib\"\n      cp -L \"$src_root/lib/$lib\" \"$root/lib/$lib\"\n    fi\n  done\n\n  local interp\n  interp=\"$(readelf -l\
        \ \"$src\" 2>/dev/null | awk -F': ' '/interpreter/ {gsub(/]$/, \"\", $2); print $2; exit}')\"\n  if [[ -n \"${interp:-}\" && -e \"$src_root$interp\" ]]; then\n\
        \    mkdir -p \"$root$(dirname \"$interp\")\"\n    cp -L \"$src_root$interp\" \"$root$interp\"\n  fi\n}\n\nmake_busybox_root() {\n  local root=\"$1\"\n  shift\n\
        \  mkdir -p \"$root/bin\" \"$root/sbin\" \"$root/dev\" \"$root/proc\" \"$root/sys\" \"$root/run\" \"$root/tmp\"\n  cp \"$(command -v busybox)\" \"$root/bin/busybox\"\
        \n  chmod +x \"$root/bin/busybox\"\n  for applet in \"$@\"; do\n    ln -sf /bin/busybox \"$root/bin/$applet\"\n  done\n  ln -sf /bin/busybox \"$root/sbin/mdev\"\
        \n  ln -sf /bin/busybox \"$root/sbin/reboot\"\n  ln -sf /bin/busybox \"$root/sbin/switch_root\"\n}\n\necho \"Building OpenWrt RAID boot initramfs...\"\nmake_busybox_root\
        \ \"$raid_root\" \\\n  sh ash cat clear echo find grep head insmod ln ls mkdir mount printf ps readlink reboot \\\n  mkfifo rm sed sh sleep sort stty switch_root\
        \ sync tail tee test touch tr true umount uname\nmkdir -p \"$raid_root/lib/modules/$openwrt_kernel_version\" \"$raid_root/sbin\" \"$raid_root/etc\"\ncopy_openwrt_binary_with_libs\
        \ /sbin/mdadm \"$raid_root\"\n\nfor lib in libc.so ld-musl-x86_64.so.1 libgcc_s.so.1; do\n  if [[ -e \"$src_root/lib/$lib\" ]]; then\n    cp -L \"$src_root/lib/$lib\"\
        \ \"$raid_root/lib/$lib\"\n  fi\ndone\n\nfor module in libcrc32c.ko md-mod.ko raid1.ko; do\n  if [[ -f \"$src_root/lib/modules/$openwrt_kernel_version/$module\"\
        \ ]]; then\n    cp \"$src_root/lib/modules/$openwrt_kernel_version/$module\" \"$raid_root/lib/modules/$openwrt_kernel_version/$module\"\n  fi\ndone\n\ncat\
        \ > \"$raid_root/init\" <<'RAIDINIT'\n#!/bin/sh\nexport PATH=/bin:/sbin\n\nmount -t proc proc /proc 2>/dev/null || true\nmount -t sysfs sysfs /sys 2>/dev/null\
        \ || true\nmount -t devtmpfs devtmpfs /dev 2>/dev/null || true\nmkdir -p /run /tmp /newroot /dev/md\nmount -t tmpfs tmpfs /run 2>/dev/null || true\nmount\
        \ -t tmpfs tmpfs /tmp 2>/dev/null || true\n\nsetup_dual_output_console() {\n  [ -c /dev/ttyS0 ] && stty -F /dev/ttyS0 115200 2>/dev/null || true\n\n  outputs=\"\
        \"\n  if [ -c /dev/tty1 ]; then\n    outputs=\"$outputs /dev/tty1\"\n  elif [ -c /dev/tty0 ]; then\n    outputs=\"$outputs /dev/tty0\"\n  fi\n  [ -c /dev/ttyS0\
        \ ] && outputs=\"$outputs /dev/ttyS0\"\n\n  if [ -n \"$outputs\" ]; then\n    rm -f /tmp/console-tee\n    mkfifo /tmp/console-tee 2>/dev/null || true\n  \
        \  if [ -p /tmp/console-tee ]; then\n      tee $outputs < /tmp/console-tee >/dev/null &\n      exec > /tmp/console-tee 2>&1\n    fi\n  fi\n}\n\nsetup_dual_output_console\n\
        \nKVER=\"$(uname -r)\"\nfor module in libcrc32c md-mod raid1; do\n  if [ -f \"/lib/modules/$KVER/$module.ko\" ]; then\n    insmod \"/lib/modules/$KVER/$module.ko\"\
        \ 2>/dev/null || true\n  fi\ndone\n\nmdev -s 2>/dev/null || true\nsleep 2\n\ndevices=\"\"\nfor dev in /dev/sd*[0-9] /dev/vd*[0-9] /dev/xvd*[0-9] /dev/nvme[0-9]n[0-9]p[0-9]\
        \ /dev/mmcblk[0-9]p[0-9]; do\n  [ -b \"$dev\" ] || continue\n  if mdadm --examine \"$dev\" 2>/dev/null | grep -q 'Raid Level : raid1'; then\n    devices=\"\
        $devices $dev\"\n  fi\ndone\n\nif [ -z \"$devices\" ]; then\n  echo \"No mdadm member partitions found.\"\n  exec sh\nfi\n\nmdadm --assemble /dev/md/openwrt-root\
        \ $devices --run 2>/tmp/mdadm.log || \\\nmdadm --assemble /dev/md0 $devices --run 2>>/tmp/mdadm.log || {\n  echo \"Failed to assemble OpenWrt RAID1 root.\"\
        \n  cat /tmp/mdadm.log\n  exec sh\n}\n\nmdev -s 2>/dev/null || true\nsleep 1\n\nrootdev=\"\"\nfor candidate in /dev/md/openwrt-root /dev/md0 /dev/md/* /dev/md[0-9]*;\
        \ do\n  [ -b \"$candidate\" ] || continue\n  if mount -o rw \"$candidate\" /newroot 2>/tmp/mount-root.log; then\n    rootdev=\"$candidate\"\n    break\n \
        \ fi\ndone\n\nif [ -z \"$rootdev\" ]; then\n  echo \"Failed to mount assembled RAID root.\"\n  cat /tmp/mount-root.log 2>/dev/null || true\n  cat /proc/mdstat\n\
        \  exec sh\nfi\n\nmount -o move /proc /newroot/proc 2>/dev/null || true\nmount -o move /sys /newroot/sys 2>/dev/null || true\nmount -o move /dev /newroot/dev\
        \ 2>/dev/null || true\nexec switch_root /newroot /sbin/init\nRAIDINIT\nchmod +x \"$raid_root/init\"\n(cd \"$raid_root\" && find . -print0 | cpio --null -o\
        \ --format=newc | gzip -9) > \"$iso_root/payload/raid-initramfs.gz\"\n\necho \"Building installer initramfs...\"\nmake_busybox_root \"$installer_root\" \\\
        \n  sh ash awk basename cat clear cut dd dirname dmesg echo false find free grep gunzip gzip head hexdump \\\n  insmod kill ln ls lsmod mkdir mkfifo mknod\
        \ mount mv printf ps readlink reboot rm rmdir rmmod sed \\\n  seq sha256sum sleep sort stty sync tail tee test touch tr true umount uname wc\nmkdir -p \"\
        $installer_root/etc\" \"$installer_root/lib/modules\" \"$installer_root/usr/sbin\" \"$installer_root/usr/bin\" \"$installer_root/sbin\"\n\nkernel_path=\"\
        $(ls -1 /boot/vmlinuz-*-generic 2>/dev/null | sort -V | tail -n 1 || true)\"\nif [[ -z \"$kernel_path\" ]]; then\n  kernel_version=\"$(uname -r)\"\n  kernel_path=\"\
        /boot/vmlinuz-$kernel_version\"\nelse\n  kernel_version=\"${kernel_path##*/vmlinuz-}\"\nfi\nif [[ ! -f \"$kernel_path\" ]]; then\n  echo \"No usable installer\
        \ kernel found under /boot.\" >&2\n  exit 1\nfi\ncp \"$kernel_path\" \"$iso_root/boot/vmlinuz\"\n\ntest -d \"/lib/modules/$kernel_version\" || { echo \"::error::Matching\
        \ installer kernel modules are missing\"; exit 1; }\nif [[ -d \"/lib/modules/$kernel_version\" ]]; then\n  required_installer_modules=\"isofs loop sr_mod\
        \ ext4 md-mod raid1\"\n  copy_installer_module() {\n    local module=\"$1\"\n    local deps\n    local description\n    if ! description=\"$(modprobe --show-depends\
        \ -S \"$kernel_version\" \"$module\" 2>&1)\"; then\n      case \" $required_installer_modules \" in\n        *\" $module \"*) echo \"::error::Required installer\
        \ driver missing: $module\"; return 1 ;;\n        *) echo \"::warning::Optional installer driver unavailable: $module\"; return 0 ;;\n      esac\n    fi\n\
        \    deps=\"$(printf '%s\\n' \"$description\" | awk '/^insmod / {print $2}')\"\n    if [[ -z \"$deps\" ]]; then\n      if [[ \"$(modinfo -k \"$kernel_version\"\
        \ -F filename \"$module\" 2>/dev/null)\" == '(builtin)' ]]; then\n        echo \"Installer driver built into matching kernel: $module\"; return 0\n      fi\n\
        \      echo \"::error::No loadable path or builtin evidence: $module\"; return 1\n    fi\n    while read -r src; do\n        [[ -f \"$src\" ]] || { echo \"\
        ::error::Resolved installer dependency missing: $src\"; return 1; }\n        local dest=\"$installer_root$src\"\n        mkdir -p \"$(dirname \"$dest\")\"\
        \n        if [[ ! -e \"$dest\" && ! -e \"${dest%.zst}\" ]]; then\n          cp \"$src\" \"$dest\"\n          if [[ \"$dest\" == *.ko.zst ]]; then\n      \
        \      zstd -d --rm \"$dest\" >/dev/null || {\n              echo \"::error::failed to decompress installer module: $src\"\n              rm -f \"$dest\"\n\
        \              return 1\n            }\n          fi\n        fi\n    done <<< \"$deps\"\n  }\n\n  installer_modules=(\n    isofs udf sr_mod cdrom loop\n\
        \    ahci libahci ata_piix libata scsi_mod sd_mod sg\n    mpt3sas megaraid_sas hpsa smartpqi aacraid mpi3mr pm80xx 3w-sas 3w-9xxx 3w-xxxx arcmsr\n    usb_storage\
        \ uas xhci_pci xhci_hcd ehci_pci ehci_hcd ohci_pci ohci_hcd uhci_hcd\n    hid hid_generic usbhid usbkbd atkbd i8042 libps2 serio serio_raw evdev\n    nvme\
        \ nvme_core\n    virtio virtio_pci virtio_blk virtio_scsi virtio_ring\n    vfat nls_cp437 nls_iso8859-1 ext4 mbcache jbd2\n    md-mod raid1 libcrc32c\n  )\n\
        \  for module in \"${installer_modules[@]}\"; do\n    copy_installer_module \"$module\"\n  done\n  for metadata in modules.order modules.builtin modules.builtin.modinfo;\
        \ do\n    test -f \"/lib/modules/$kernel_version/$metadata\" || { echo \"::error::Missing matching kernel metadata: $metadata\"; exit 1; }\n    mkdir -p \"\
        $installer_root/lib/modules/$kernel_version\"\n    cp \"/lib/modules/$kernel_version/$metadata\" \"$installer_root/lib/modules/$kernel_version/\"\n  done\n\
        \  depmod -b \"$installer_root\" \"$kernel_version\"\n  for module in $required_installer_modules; do\n    modprobe -d \"$installer_root\" -S \"$kernel_version\"\
        \ --show-depends \"$module\" >/dev/null\n  done\nfi\n\nfor bin in \\\n  /usr/sbin/modprobe /usr/bin/kmod \\\n  /usr/sbin/mdadm /usr/sbin/sgdisk /usr/sbin/partprobe\
        \ /usr/sbin/wipefs \\\n  /usr/sbin/e2fsck /usr/sbin/resize2fs /usr/sbin/blkid /usr/sbin/mkfs.vfat \\\n  /usr/bin/loadkeys /usr/bin/sha256sum /usr/bin/awk\
        \ /usr/bin/sed /usr/bin/grep /usr/bin/sort /usr/bin/head /usr/bin/tail; do\n  [[ -x \"$bin\" ]] && copy_binary_with_libs \"$bin\" \"$installer_root\"\ndone\n\
        cat > \"$installer_root/etc/no-tab.kmap\" <<'KEYMAP'\nkeycode 15 = VoidSymbol\nKEYMAP\n\ncp \"$PAYLOAD\" \"$iso_root/payload/openwrt.img.gz\"\nprintf '%s\\\
        n' \"$payload_name\" > \"$iso_root/payload/name\"\nsha256sum \"$PAYLOAD\" | awk '{print $1}' > \"$iso_root/payload/sha256\"\nprintf '%s\\n' \"$root_start\"\
        \ > \"$iso_root/payload/root-start-sector\"\nstat -c %s \"$src_img\" > \"$iso_root/payload/raw-bytes\"\n\ncat > \"$workdir/installed-efi-grub.cfg\" <<'EFICFG'\n\
        if [ -e (hd0,gpt1)/boot/grub/grub.cfg ]; then\n  set root=(hd0,gpt1)\n  set prefix=(hd0,gpt1)/boot/grub\n  set boot_source=efi-fallback-hd0-gpt1\n  configfile\
        \ /boot/grub/grub.cfg\nfi\nif [ -e (hd1,gpt1)/boot/grub/grub.cfg ]; then\n  set root=(hd1,gpt1)\n  set prefix=(hd1,gpt1)/boot/grub\n  set boot_source=efi-fallback-hd1-gpt1\n\
        \  configfile /boot/grub/grub.cfg\nfi\nif [ -e (hd2,gpt1)/boot/grub/grub.cfg ]; then\n  set root=(hd2,gpt1)\n  set prefix=(hd2,gpt1)/boot/grub\n  set boot_source=efi-fallback-hd2-gpt1\n\
        \  configfile /boot/grub/grub.cfg\nfi\nif [ -e (hd3,gpt1)/boot/grub/grub.cfg ]; then\n  set root=(hd3,gpt1)\n  set prefix=(hd3,gpt1)/boot/grub\n  set boot_source=efi-fallback-hd3-gpt1\n\
        \  configfile /boot/grub/grub.cfg\nfi\necho \"Could not locate /boot/grub/grub.cfg on kernel boot partition.\"\necho \"Try: configfile (hd0,gpt1)/boot/grub/grub.cfg\"\
        \nsleep --interruptible 30\nEFICFG\ngrub-mkstandalone -O x86_64-efi \\\n  --modules=\"part_gpt fat ext2 normal configfile linux gzio test sleep serial terminal\"\
        \ \\\n  -o \"$iso_root/payload/bootx64.efi\" \\\n  \"boot/grub/grub.cfg=$workdir/installed-efi-grub.cfg\"\n\nmknod -m 600 \"$installer_root/dev/console\"\
        \ c 5 1 2>/dev/null || true\nmknod -m 666 \"$installer_root/dev/null\" c 1 3 2>/dev/null || true\n\ncat > \"$installer_root/init\" <<'INSTALLINIT'\n#!/bin/sh\n\
        export PATH=/bin:/sbin:/usr/bin:/usr/sbin\n\nmount -t proc proc /proc 2>/dev/null || true\nmount -t sysfs sysfs /sys 2>/dev/null || true\nmount -t devtmpfs\
        \ devtmpfs /dev 2>/dev/null || true\nmkdir -p /tmp /run /media /targetroot /targetboot /dev/md\nmount -t tmpfs tmpfs /run 2>/dev/null || true\nmount -t tmpfs\
        \ tmpfs /tmp 2>/dev/null || true\n\nsetup_ui_console() {\n  [ -c /dev/ttyS0 ] && stty -F /dev/ttyS0 115200 2>/dev/null || true\n\n  outputs=\"\"\n  if [ -c\
        \ /dev/tty1 ]; then\n    outputs=\"$outputs /dev/tty1\"\n  elif [ -c /dev/tty0 ]; then\n    outputs=\"$outputs /dev/tty0\"\n  fi\n  [ -c /dev/ttyS0 ] && outputs=\"\
        $outputs /dev/ttyS0\"\n\n  if [ -n \"$outputs\" ]; then\n    rm -f /tmp/console-tee\n    mkfifo /tmp/console-tee 2>/dev/null || true\n    if [ -p /tmp/console-tee\
        \ ]; then\n      tee $outputs < /tmp/console-tee >/dev/null &\n      exec > /tmp/console-tee 2>&1\n    fi\n  fi\n\n  rm -f /tmp/console-input\n  mkfifo /tmp/console-input\
        \ 2>/dev/null || true\n  if [ -p /tmp/console-input ]; then\n    exec 3<>/tmp/console-input\n    forward_input() {\n      dev=\"$1\"\n      [ -c \"$dev\"\
        \ ] || return\n      [ \"$dev\" = \"/dev/ttyS0\" ] && stty -F \"$dev\" 115200 2>/dev/null || true\n      while IFS= read -r line < \"$dev\"; do\n        printf\
        \ '%s\\n' \"$line\" >&3\n      done\n    }\n    if [ -c /dev/tty1 ]; then\n      forward_input /dev/tty1 &\n    else\n      forward_input /dev/tty0 &\n  \
        \  fi\n    forward_input /dev/ttyS0 &\n    exec < /tmp/console-input\n  else\n    exec < /dev/console\n  fi\n}\n\nsetup_ui_console\n\nfor module in \\\n \
        \ isofs udf sr_mod cdrom loop \\\n  ahci libahci ata_piix sd_mod sg scsi_mod usb_storage uas \\\n  mpt3sas megaraid_sas hpsa smartpqi aacraid mpi3mr pm80xx\
        \ 3w-sas 3w-9xxx 3w-xxxx arcmsr \\\n  hid hid_generic usbhid usbkbd atkbd i8042 libps2 serio serio_raw evdev \\\n  nvme nvme_core \\\n  virtio virtio_pci\
        \ virtio_blk virtio_scsi \\\n  xhci_pci ehci_pci ohci_pci uhci_hcd \\\n  mpt3sas megaraid_sas hpsa \\\n  vfat nls_cp437 nls_iso8859-1 ext4 mbcache jbd2 \\\
        \n  md-mod raid1 libcrc32c; do\n  modprobe \"$module\" 2>/dev/null || true\ndone\nmdev -s 2>/dev/null || true\nsleep 2\n\ndisable_vga_tab_key() {\n  [ -x\
        \ /usr/bin/loadkeys ] || return 0\n  console=\"\"\n  [ -c /dev/tty1 ] && console=/dev/tty1\n  [ -z \"$console\" ] && [ -c /dev/tty0 ] && console=/dev/tty0\n\
        \  [ -n \"$console\" ] || return 0\n  loadkeys -q -C \"$console\" /etc/no-tab.kmap 2>/tmp/loadkeys.log || {\n    echo \"warning: failed to load no-tab keymap\
        \ on $console\"\n    cat /tmp/loadkeys.log 2>/dev/null || true\n  }\n}\ndisable_vga_tab_key\n\ntrim() {\n  echo \"$*\" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'\n\
        }\n\nclean_input() {\n  printf '%s' \"$*\" | tr '\\r\\t' '  ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'\n}\n\nread_first() {\n  for file in \"$@\"; do\n\
        \    [ -r \"$file\" ] || continue\n    value=\"$(cat \"$file\" 2>/dev/null | head -n 1)\"\n    value=\"$(trim \"$value\")\"\n    [ -n \"$value\" ] && { echo\
        \ \"$value\"; return; }\n  done\n}\n\nparent_disk() {\n  dev=\"$1\"\n  dev=\"${dev#/dev/}\"\n  dev=\"${dev##*/}\"\n  case \"$dev\" in\n    nvme*n*p[0-9]*)\
        \ echo \"$dev\" | sed 's/p[0-9][0-9]*$//' ;;\n    mmcblk*p[0-9]*) echo \"$dev\" | sed 's/p[0-9][0-9]*$//' ;;\n    sd*[0-9]*|vd*[0-9]*|xvd*[0-9]*) echo \"\
        $dev\" | sed 's/[0-9][0-9]*$//' ;;\n    *) echo \"$dev\" ;;\n  esac\n}\n\npart_dev() {\n  disk=\"$1\"\n  part=\"$2\"\n  case \"$disk\" in\n    nvme*|mmcblk*)\
        \ echo \"/dev/${disk}p${part}\" ;;\n    *) echo \"/dev/${disk}${part}\" ;;\n  esac\n}\n\ntry_payload_device() {\n  candidate=\"$1\"\n  shift\n  [ -b \"$candidate\"\
        \ ] || return 1\n\n  umount /media 2>/dev/null || true\n  for fs in \"$@\"; do\n    opts=\"ro\"\n    [ \"$fs\" = \"ext4\" ] && opts=\"ro,noload\"\n    if\
        \ mount -o \"$opts\" -t \"$fs\" \"$candidate\" /media 2>/dev/null; then\n      if [ -f /media/payload/openwrt.img.gz ]; then\n        MEDIA_DEV=\"$candidate\"\
        \n        MEDIA_PARENT=\"$(parent_disk \"$candidate\")\"\n        PAYLOAD_PATH=\"/media/payload/openwrt.img.gz\"\n        PAYLOAD_NAME=\"$(cat /media/payload/name\
        \ 2>/dev/null || echo openwrt.img.gz)\"\n        PAYLOAD_SHA256=\"$(cat /media/payload/sha256 2>/dev/null || true)\"\n        ROOT_START_SECTOR=\"$(cat /media/payload/root-start-sector\
        \ 2>/dev/null || echo 524800)\"\n        RAID_INITRAMFS=\"/media/payload/raid-initramfs.gz\"\n        EFI_BOOTX64=\"/media/payload/bootx64.efi\"\n       \
        \ export MEDIA_DEV MEDIA_PARENT PAYLOAD_PATH PAYLOAD_NAME PAYLOAD_SHA256 ROOT_START_SECTOR RAID_INITRAMFS EFI_BOOTX64\n        return 0\n      fi\n      umount\
        \ /media 2>/dev/null || true\n    fi\n  done\n  return 1\n}\n\nis_removable_candidate() {\n  dev=\"$(readlink -f \"$1\" 2>/dev/null || echo \"$1\")\"\n  dev=\"\
        ${dev#/dev/}\"\n  parent=\"$(parent_disk \"$dev\")\"\n  [ -r \"/sys/block/$parent/removable\" ] || return 1\n  [ \"$(cat \"/sys/block/$parent/removable\"\
        \ 2>/dev/null)\" = \"1\" ]\n}\n\nfind_payload() {\n  echo \"Waiting for installer virtual CD/DVD media...\"\n  i=0\n  while [ \"$i\" -lt 45 ]; do\n    mdev\
        \ -s 2>/dev/null || true\n    for candidate in /dev/sr* /dev/cdrom; do\n      try_payload_device \"$candidate\" iso9660 udf && return 0\n    done\n    i=$((i\
        \ + 1))\n    sleep 1\n  done\n\n  echo \"Virtual CD/DVD payload not found; checking removable USB media only...\"\n  for candidate in /dev/sd[a-z] /dev/sd[a-z][0-9]*\
        \ /dev/xvd[a-z] /dev/xvd[a-z][0-9]* /dev/nvme[0-9]n[0-9] /dev/nvme[0-9]n[0-9]p[0-9] /dev/mmcblk[0-9] /dev/mmcblk[0-9]p[0-9]; do\n    [ -b \"$candidate\" ]\
        \ || continue\n    is_removable_candidate \"$candidate\" || continue\n    try_payload_device \"$candidate\" iso9660 udf vfat ext4 && return 0\n  done\n\n\
        \  return 1\n}\n\nif ! find_payload; then\n  echo \"Cannot find installer payload on CD/virtual media.\"\n  exec sh\nfi\n\nsize_gb() {\n  sectors=\"$1\"\n\
        \  echo $((sectors * 512 / 1000 / 1000 / 1000))\n}\n\nshow_hardware() {\n  cpu=\"$(awk -F': ' '/model name|Hardware|Processor/ {print $2; exit}' /proc/cpuinfo\
        \ 2>/dev/null)\"\n  [ -n \"$cpu\" ] || cpu=\"Unknown CPU\"\n  cores=\"$(grep -c '^processor' /proc/cpuinfo 2>/dev/null || echo 0)\"\n  [ \"$cores\" -gt 0\
        \ ] 2>/dev/null || cores=1\n  mem_kb=\"$(awk '/MemTotal/ {print $2; exit}' /proc/meminfo 2>/dev/null)\"\n  mem_gb=$(((mem_kb + 1048575) / 1048576))\n  vendor=\"\
        $(read_first /sys/class/dmi/id/sys_vendor)\"\n  product=\"$(read_first /sys/class/dmi/id/product_name)\"\n  bios=\"$(read_first /sys/class/dmi/id/bios_version)\"\
        \n\n  echo \"System : ${vendor:-Unknown} ${product:-Unknown}\"\n  echo \"BIOS   : ${bios:-Unknown}\"\n  echo \"CPU    : $cpu ($cores cores)\"\n  echo \"Memory\
        \ : ${mem_gb} GB\"\n  echo\n  echo \"Network:\"\n  found_net=0\n  for iface_path in /sys/class/net/*; do\n    [ -e \"$iface_path\" ] || continue\n    iface=\"\
        ${iface_path##*/}\"\n    [ \"$iface\" = \"lo\" ] && continue\n    mac=\"$(cat \"$iface_path/address\" 2>/dev/null)\"\n    driver=\"$(basename \"$(readlink\
        \ \"$iface_path/device/driver\" 2>/dev/null)\" 2>/dev/null)\"\n    echo \"  $iface  ${mac:-unknown}  ${driver:-unknown}\"\n    found_net=1\n  done\n  [ \"\
        $found_net\" -eq 1 ] || echo \"  No network interfaces detected\"\n}\n\nbuild_disk_list() {\n  : > /tmp/disks.list\n  idx=1\n  for sysdev in /sys/block/*;\
        \ do\n    [ -e \"$sysdev/size\" ] || continue\n    dev=\"${sysdev##*/}\"\n    case \"$dev\" in\n      loop*|ram*|sr*|fd*|dm-*|md*|zram*) continue ;;\n   \
        \ esac\n    [ -n \"$MEDIA_PARENT\" ] && [ \"$dev\" = \"$MEDIA_PARENT\" ] && continue\n    sectors=\"$(cat \"$sysdev/size\" 2>/dev/null || echo 0)\"\n    [\
        \ \"$sectors\" -gt 0 ] 2>/dev/null || continue\n    gb=\"$(size_gb \"$sectors\")\"\n    vendor=\"$(read_first \"$sysdev/device/vendor\")\"\n    model=\"$(read_first\
        \ \"$sysdev/device/model\" \"$sysdev/device/name\")\"\n    serial=\"$(read_first \"$sysdev/device/serial\" \"$sysdev/device/wwid\")\"\n    removable=\"$(cat\
        \ \"$sysdev/removable\" 2>/dev/null || echo 0)\"\n    rotational=\"$(cat \"$sysdev/queue/rotational\" 2>/dev/null || echo '?')\"\n    media=\"SSD/NVMe\"\n\
        \    [ \"$rotational\" = \"1\" ] && media=\"HDD\"\n    [ \"$removable\" = \"1\" ] && media=\"$media removable\"\n    printf '%s\\t%s\\t%s\\t%s\\t%s\\t%s\\\
        t%s\\n' \"$idx\" \"$dev\" \"$gb\" \"${vendor:-Unknown}\" \"${model:-Unknown}\" \"${serial:-Unknown}\" \"$media\" >> /tmp/disks.list\n    idx=$((idx + 1))\n\
        \  done\n}\n\nshow_disks() {\n  build_disk_list\n  echo \"Target disks:\"\n  if [ ! -s /tmp/disks.list ]; then\n    echo \"  No writable disks detected.\"\
        \n    return\n  fi\n  while IFS='\t' read -r idx dev gb vendor model serial media; do\n    printf '  %s) /dev/%s  %s GB  %s  %s %s  SN:%s\\n' \"$idx\" \"\
        $dev\" \"$gb\" \"$media\" \"$vendor\" \"$model\" \"$serial\"\n  done < /tmp/disks.list\n}\n\ndisk_by_index() {\n  choice=\"$1\"\n  while IFS='\t' read -r\
        \ idx dev gb vendor model serial media; do\n    [ \"$idx\" = \"$choice\" ] && { echo \"$dev\"; return; }\n  done < /tmp/disks.list\n}\n\nselected_disks()\
        \ {\n  choices=\"$(clean_input \"$1\" | tr ',;' '  ')\"\n  selected=\"\"\n  for choice in $choices; do\n    dev=\"$(disk_by_index \"$choice\")\"\n    [ -n\
        \ \"$dev\" ] || return 1\n    case \" $selected \" in\n      *\" $dev \"*) ;;\n      *) selected=\"$selected $dev\" ;;\n    esac\n  done\n  echo \"$(trim\
        \ \"$selected\")\"\n}\n\nword_count() {\n  n=0\n  for item in \"$@\"; do\n    [ -n \"$item\" ] && n=$((n + 1))\n  done\n  echo \"$n\"\n}\n\nconfirm_install()\
        \ {\n  echo\n  echo \"WARNING: selected disks will be overwritten.\"\n  printf 'Type ERASE to confirm disk wipe: '\n  read -r confirm_erase\n  confirm_erase=\"\
        $(clean_input \"$confirm_erase\")\"\n  [ \"$confirm_erase\" = \"ERASE\" ] || return 1\n  printf 'Type INSTALL to start: '\n  read -r confirm_install_word\n\
        \  confirm_install_word=\"$(clean_input \"$confirm_install_word\")\"\n  [ \"$confirm_install_word\" = \"INSTALL\" ] || return 1\n  return 0\n}\n\nverify_payload()\
        \ {\n  echo \"Verifying embedded image...\"\n  for tool in gunzip dd sgdisk partprobe mdev sha256sum; do\n    command -v \"$tool\" >/dev/null || { echo \"\
        Missing required tool: $tool\"; return 1; }\n  done\n  PAYLOAD_DIR=\"${PAYLOAD_PATH%/*}\"\n  [ -f \"$PAYLOAD_DIR/sha256\" ] && [ -f \"$PAYLOAD_DIR/raw-bytes\"\
        \ ] && [ -f \"$PAYLOAD_DIR/root-start-sector\" ] || { echo \"Missing required payload metadata\"; return 1; }\n  printf '%s' \"$PAYLOAD_SHA256\" | grep -Eq\
        \ '^[0-9a-f]{64}$' || { echo \"Invalid payload checksum metadata\"; return 1; }\n  PAYLOAD_BYTES=\"$(cat \"$PAYLOAD_DIR/raw-bytes\")\"\n  printf '%s' \"$PAYLOAD_BYTES\"\
        \ | grep -Eq '^[0-9]+$' || return 1\n  printf '%s' \"$ROOT_START_SECTOR\" | grep -Eq '^[1-9][0-9]*$' || return 1\n  if [ -n \"$PAYLOAD_SHA256\" ]; then\n\
        \    actual=\"$(sha256sum \"$PAYLOAD_PATH\" | awk '{print $1}')\"\n    if [ \"$actual\" != \"$PAYLOAD_SHA256\" ]; then\n      echo \"SHA256 verification failed.\"\
        \n      echo \"expected: $PAYLOAD_SHA256\"\n      echo \"actual  : $actual\"\n      return 1\n    fi\n  fi\n  (set -o pipefail; gunzip -c \"$PAYLOAD_PATH\"\
        \ | /sbin/fullcone-target-gpt --source-check \"$PAYLOAD_BYTES\" \"$ROOT_START_SECTOR\") || return 1\n  return 0\n}\n\nwrite_raid_boot_files() {\n  bootpart=\"\
        $1\"\n  echo \"Installing RAID boot files to $bootpart ...\"\n  mount -o rw \"$bootpart\" /targetboot || return 1\n  mkdir -p /targetboot/boot/grub || return\
        \ 1\n  cp \"$RAID_INITRAMFS\" /targetboot/boot/raid-initramfs.gz || return 1\n  if [ -f \"$EFI_BOOTX64\" ]; then\n    mkdir -p /targetboot/efi/boot || return\
        \ 1\n    cp \"$EFI_BOOTX64\" /targetboot/efi/boot/bootx64.efi || return 1\n  fi\n  cat > /targetboot/boot/grub/grub.cfg <<'GRUBCFG' || return 1\nserial --unit=0\
        \ --speed=115200 --word=8 --parity=no --stop=1 --rtscts=off\nterminal_input console serial; terminal_output console serial\n\nset default=\"0\"\nset timeout=\"\
        3\"\n\nset root=(hd0,gpt1)\nif [ ! -e /boot/vmlinuz ]; then\n\tset root=(hd1,gpt1)\nfi\nif [ ! -e /boot/vmlinuz ]; then\n\tset root=(hd2,gpt1)\nfi\nif [ !\
        \ -e /boot/vmlinuz ]; then\n\tset root=(hd3,gpt1)\nfi\nif [ x$boot_source = x ]; then\n\tset boot_source=default-grub-prefix\nfi\n\necho \"GRUB boot source:\
        \ $boot_source\"\n\nmenuentry \"ImmortalWrt RAID1\" {\n\tlinux /boot/vmlinuz root=/dev/md/openwrt-root rootwait console=ttyS0,115200n8 console=tty1 grub_source=$boot_source\n\
        \tinitrd /boot/raid-initramfs.gz\n}\nmenuentry \"ImmortalWrt RAID1 (failsafe)\" {\n\tlinux /boot/vmlinuz failsafe=true root=/dev/md/openwrt-root rootwait\
        \ console=ttyS0,115200n8 console=tty1 grub_source=$boot_source\n\tinitrd /boot/raid-initramfs.gz\n}\nGRUBCFG\n  sync || return 1\n  umount /targetboot ||\
        \ return 1\n}\n\ncheck_target_idle() {\n  for node in /sys/class/block/\"$1\" /sys/class/block/\"$1\"/\"$1\"*; do\n    [ -d \"$node\" ] || continue\n    for\
        \ holder in \"$node\"/holders/*; do\n      [ ! -e \"$holder\" ] || { echo \"Selected disk is in use: $holder\"; return 1; }\n    done\n    if grep -q \"^/dev/${node##*/}\
        \ \" /proc/mounts; then\n      echo \"Selected disk has a mounted filesystem: ${node##*/}\"\n      return 1\n    fi\n  done\n}\n\nwrite_base_image() {\n \
        \ disk=\"$1\"\n  echo\n  echo \"Writing base image to /dev/$disk ...\"\n  check_target_idle \"$disk\" || return 1\n  /sbin/fullcone-target-gpt --target-check\
        \ \"$PAYLOAD_BYTES\" \"/dev/$disk\" || return 1\n  wipefs -a \"/dev/$disk\" || return 1\n  # ptgen intentionally omits backup GPT in sysupgrade images. Repair\
        \ only the installed target.\n  (set -o pipefail; gunzip -c \"$PAYLOAD_PATH\" | dd of=\"/dev/$disk\" bs=4M) || return 1\n  sync || return 1\n  /sbin/fullcone-target-gpt\
        \ \"/dev/$disk\" || return 1\n  partprobe \"/dev/$disk\" || return 1\n  mdev -s || return 1\n  sleep 1\n}\n\ninstall_single() {\n  target=\"$1\"\n  clear\n\
        \  echo \"Single disk install target:\"\n  grep \"^[0-9][0-9]*\t$target\t\" /tmp/disks.list | while IFS='\t' read -r idx dev gb vendor model serial media;\
        \ do\n    echo \"  /dev/$dev  $gb GB  $media  $vendor $model  SN:$serial\"\n  done\n  echo\n  echo \"Image : $PAYLOAD_NAME\"\n  echo \"SHA256: ${PAYLOAD_SHA256:-unknown}\"\
        \n  confirm_install || { echo \"Cancelled.\"; sleep 2; return; }\n  verify_payload || return 1\n  write_base_image \"$target\" || return 1\n  echo\n  echo\
        \ \"Single disk install completed.\"\n  echo \"Unmount/eject the IPMI ISO, then reboot from disk.\"\n  read _\n}\n\ninstall_raid1() {\n  [ ! -e /dev/md/openwrt-root\
        \ ] && [ ! -e /dev/md0 ] || { echo \"An existing RAID array occupies the installer name; refusing to stop it.\"; return 1; }\n  targets=\"$1\"\n  set -- $targets\n\
        \  count=\"$(word_count \"$@\")\"\n  if [ \"$count\" -lt 2 ]; then\n    echo \"True mdadm RAID1 requires at least two disks.\"\n    sleep 2\n    return\n\
        \  fi\n\n  clear\n  echo \"True mdadm RAID1 install targets:\"\n  for target in \"$@\"; do\n    grep \"^[0-9][0-9]*\t$target\t\" /tmp/disks.list | while IFS='\t\
        ' read -r idx dev gb vendor model serial media; do\n      echo \"  /dev/$dev  $gb GB  $media  $vendor $model  SN:$serial\"\n    done\n  done\n  echo\n  echo\
        \ \"Image : $PAYLOAD_NAME\"\n  echo \"SHA256: ${PAYLOAD_SHA256:-unknown}\"\n  echo\n  echo \"This creates /dev/md/openwrt-root as RAID1 metadata=1.0.\"\n\
        \  echo \"The boot partition is duplicated on every selected disk.\"\n  confirm_install || { echo \"Cancelled.\"; sleep 2; return; }\n  verify_payload ||\
        \ return 1\n\n  # Validate every selected target before writing the first member.\n  for target in \"$@\"; do\n    check_target_idle \"$target\" || return\
        \ 1\n    /sbin/fullcone-target-gpt --target-check \"$PAYLOAD_BYTES\" \"/dev/$target\" || return 1\n  done\n  for target in \"$@\"; do\n    write_base_image\
        \ \"$target\" || return 1\n  done\n\n  parts=\"\"\n  for target in \"$@\"; do\n    disk=\"/dev/$target\"\n    echo\n    echo \"Preparing RAID member on $disk\
        \ ...\"\n    /sbin/fullcone-target-gpt \"$disk\" || return 1\n    mbr_snapshot=\"/tmp/fullcone-mbr-$target\"\n    dd if=\"$disk\" of=\"$mbr_snapshot\" bs=446\
        \ count=1 || return 1\n    sgdisk -d 2 \"$disk\" >/dev/null || return 1\n    sgdisk -n \"2:${ROOT_START_SECTOR}:0\" -t 2:fd00 -c 2:\"OpenWrt RAID1 root\"\
        \ \"$disk\" >/dev/null || return 1\n    sgdisk -u \"2:R\" \"$disk\" >/dev/null || return 1\n    dd if=\"$mbr_snapshot\" of=\"$disk\" bs=446 count=1 conv=notrunc\
        \ || return 1\n    sync || return 1\n    /sbin/fullcone-target-gpt --check \"$disk\" || return 1\n    partprobe \"$disk\" || return 1\n    mdev -s || return\
        \ 1\n    sleep 1\n    part=\"$(part_dev \"$target\" 2)\"\n    [ -b \"$part\" ] || { echo \"Missing partition device: $part\"; return 1; }\n    if mdadm --examine\
        \ \"$part\" >/dev/null 2>&1; then\n      mdadm --zero-superblock --force \"$part\" || return 1\n    fi\n    parts=\"$parts $part\"\n  done\n\n  # Existing\
        \ arrays are refused by preflight; never stop unrelated arrays.\n  mkdir -p /dev/md\n  echo\n  echo \"Creating RAID1 array...\"\n  mdadm --create /dev/md/openwrt-root\
        \ --metadata=1.0 --level=1 --raid-devices=\"$count\" $parts --run --force --assume-clean || return 1\n  sleep 2\n  mdev -s || return 1\n\n  echo \"Checking\
        \ and expanding root filesystem on RAID...\"\n  fsck_status=0\n  e2fsck -fy /dev/md/openwrt-root || fsck_status=$?\n  case \"$fsck_status\" in\n    0|1) ;;\
        \ # no errors, or errors corrected\n    2|3) echo \"Filesystem corrected but reboot required; stopping installation.\"; return 1 ;;\n    *) echo \"Filesystem\
        \ check failed (status $fsck_status).\"; return 1 ;;\n  esac\n  resize2fs /dev/md/openwrt-root || return 1\n\n  mount -o rw /dev/md/openwrt-root /targetroot\
        \ || return 1\n  uuid=\"$(mdadm --detail --scan /dev/md/openwrt-root | sed -n 's/.*UUID=\\([^ ]*\\).*/\\1/p' | head -n 1)\"\n  [ -n \"$uuid\" ] || { echo\
        \ \"Missing RAID UUID\"; return 1; }\n  mkdir -p /targetroot/etc/config || return 1\n  cat > /targetroot/etc/config/mdadm <<EOF || return 1\nconfig mdadm\n\
        \tlist devices /dev/sd*\n\tlist devices /dev/vd*\n\tlist devices /dev/xvd*\n\tlist devices /dev/nvme*\n\tlist devices /dev/mmcblk*\n\tlist devices partitions\n\
        \nconfig array\n\toption uuid ${uuid}\n\toption device /dev/md/openwrt-root\nEOF\n  sync || return 1\n  umount /targetroot || return 1\n\n  for target in\
        \ \"$@\"; do\n    bootpart=\"$(part_dev \"$target\" 1)\"\n    write_raid_boot_files \"$bootpart\" || return 1\n  done\n\n  echo\n  cat /proc/mdstat\n  echo\n\
        \  echo \"True mdadm RAID1 install completed.\"\n  echo \"Unmount/eject the IPMI ISO, then reboot from disk.\"\n  echo \"Enter r to reboot now, s for shell,\
        \ or anything else to return to menu.\"\n  read -r next\n  next=\"$(clean_input \"$next\")\"\n  case \"$next\" in\n    r|R) reboot -f ;;\n    s|S) sh ;;\n\
        \  esac\n}\n\nrepair_raid_boot() {\n  clear\n  echo \"Repair RAID1 boot files\"\n  echo\n  show_disks\n  echo\n  printf 'Disk numbers to repair, for example\
        \ 1,2: '\n  read -r choice\n  choice=\"$(clean_input \"$choice\")\"\n  targets=\"$(selected_disks \"$choice\")\" || { echo \"Invalid selection.\"; sleep 2;\
        \ return; }\n  [ -n \"$targets\" ] || { echo \"Invalid selection.\"; sleep 2; return; }\n\n  for target in $targets; do\n    bootpart=\"$(part_dev \"$target\"\
        \ 1)\"\n    [ -b \"$bootpart\" ] || { echo \"Missing boot partition: $bootpart\"; return; }\n    write_raid_boot_files \"$bootpart\" || return 1\n  done\n\
        \n  echo\n  echo \"Boot repair completed.\"\n  echo \"Unmount/eject the IPMI ISO, then reboot from disk.\"\n  printf 'Press Enter to return.'\n  read -r _\n\
        }\n\nrun_install() {\n  # A subshell pipeline captures diagnostics without exiting the PID 1 menu.\n  if (set -o pipefail; \"$@\" 2>&1 | tee /tmp/fullcone-install.log);\
        \ then\n    return 0\n  fi\n  echo \"Installation stopped after an error. See /tmp/fullcone-install.log.\"\n  umount /targetroot /targetboot 2>/dev/null ||\
        \ true\n  printf 'Press Enter to return to menu.'\n  read -r _\n  return 1\n}\n\nmain_menu() {\n  while true; do\n    clear\n    echo \"============================================================\"\
        \n    echo \"          ImmortalWrt x86 mdadm RAID1 Installer\"\n    echo \"============================================================\"\n    echo \"Installer\
        \ media: ${MEDIA_DEV:-unknown}\"\n    echo \"Image          : $PAYLOAD_NAME\"\n    echo \"SHA256         : ${PAYLOAD_SHA256:-unknown}\"\n    echo\n    show_hardware\n\
        \    echo\n    show_disks\n    echo\n    echo \"Install modes:\"\n    echo \"  one disk number       normal single-disk image install\"\n    echo \"  multiple\
        \ numbers 1,2 or 1 2  true mdadm RAID1 root install\"\n    echo\n    echo \"Commands: b repair boot, r refresh, s shell, q reboot.\"\n    printf 'Select>\
        \ '\n    read -r choice\n    choice=\"$(clean_input \"$choice\")\"\n    case \"$choice\" in\n      b|B) run_install repair_raid_boot; continue ;;\n      r|R)\
        \ continue ;;\n      s|S) sh ;;\n      q|Q) reboot -f ;;\n    esac\n    targets=\"$(selected_disks \"$choice\")\" || { echo \"Invalid selection.\"; sleep\
        \ 1; continue; }\n    [ -n \"$targets\" ] || { echo \"Invalid selection.\"; sleep 1; continue; }\n    set -- $targets\n    count=\"$(word_count \"$@\")\"\n\
        \    if [ \"$count\" -eq 1 ]; then\n      run_install install_single \"$1\"\n    else\n      run_install install_raid1 \"$targets\"\n    fi\n  done\n}\n\n\
        main_menu\nINSTALLINIT\nchmod +x \"$installer_root/init\"\n\n(cd \"$installer_root\" && find . -print0 | cpio --null -o --format=newc | gzip -9) > \"$iso_root/boot/initramfs.gz\"\
        \n\ncat > \"$iso_root/boot/grub/grub.cfg\" <<'GRUB'\nset default=0\nset timeout=5\nserial --unit=0 --speed=115200 --word=8 --parity=no --stop=1\nterminal_input\
        \ console serial\nterminal_output console serial\n\nmenuentry \"ImmortalWrt x86 mdadm RAID1 installer\" {\n    linux /boot/vmlinuz nomodeset console=ttyS0,115200n8\
        \ console=tty1\n    initrd /boot/initramfs.gz\n}\nGRUB\n\necho \"Building $iso_path\"\ngrub-mkrescue -o \"$iso_path\" \"$iso_root\"\n(cd \"$(dirname \"$iso_path\"\
        )\" && sha256sum \"$(basename \"$iso_path\")\" > \"$(basename \"$iso_path\").sha256\")\nls -lh \"$iso_path\" \"$iso_path.sha256\"\nMDRAID_INSTALLER_SCRIPT\n\
        chmod +x \"$installer_script\"\nsudo \"$installer_script\" \"$FIRMWARE_DIR/$payload\" \"$ISO_OUTPUT_DIR\" \"$GITHUB_WORKSPACE/compile_script/fullcone_gpt.py\"\
        \nsudo chown -R \"$(id -u):$(id -g)\" \"$ISO_OUTPUT_DIR\"\necho \"ISO_DIR=$ISO_OUTPUT_DIR\" >> \"$GITHUB_OUTPUT\"\nls -lh \"$ISO_OUTPUT_DIR/$iso_name\" \"\
        $ISO_OUTPUT_DIR/$iso_name.sha256\"\n"
    - name: Smoke test ISO UEFI installer boot
      env: &id001
        ISO_DIR: ${{ steps.build_x86_installer_iso.outputs.ISO_DIR }}
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
        iso="$(find "$ISO_DIR" -maxdepth 1 -name '*.iso' -print -quit)"
        test -n "$iso"
        cp /usr/share/OVMF/OVMF_VARS_4M.fd "$RUNNER_TEMP/iso-smoke-vars.fd"
        set +e
        timeout 180 qemu-system-x86_64 -accel tcg -m 1024 -display none -monitor none -nic none -no-reboot \
          -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
          -drive if=pflash,format=raw,file="$RUNNER_TEMP/iso-smoke-vars.fd" \
          -cdrom "$iso" -boot d -serial file:iso-uefi-smoke.log
        status=$?
        set -e
        [ "$status" -eq 0 ] || [ "$status" -eq 124 ]
        grep -F 'mdadm RAID1 Installer' iso-uefi-smoke.log
        echo "UEFI boot reached installer menu; no target disks were attached or written"
    - name: Verify final ISO checksum
      shell: bash
      env: *id001
      run: |
        set -euo pipefail
        cd "$ISO_DIR"
        sha256sum --check ./*-mdadm-raid1-installer.iso.sha256
    - name: Upload ISO UEFI smoke log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: iso_uefi_smoke_${{ github.run_attempt }}
        path: iso-uefi-smoke.log
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload test ISO only as a CI artifact
      uses: actions/upload-artifact@v7
      with:
        name: raid1-iso-validation
        path: installer-output/*
        if-no-files-found: error
        retention-days: 3
