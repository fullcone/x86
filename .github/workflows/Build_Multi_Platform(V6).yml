name: AllImages artifact-only validation

on:
  workflow_dispatch:

concurrency:
  group: openwrt-repository-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read

env:
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: false
  FORCE_REBUILD: false

jobs:
  job_init: 
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Init
    outputs:
      output_release_tag: ${{ steps.gen_release_tag.outputs.release_tag }}
      platforms: ${{ steps.read-platforms.outputs.matrix }}
      platforms_source: ${{ steps.read-platforms.outputs.source_matrix_json }}
    steps:
      - name: Generate Tag Name
        id: gen_release_tag
        run: |
          echo "release_tag=multi-platform_$(TZ='Asia/Shanghai' date +"%Y.%m.%d_%H.%M.%S")" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Read Platforms From File
        id: read-platforms
        env:
          FC_BUILD_PLATFORMS: X86_AllImages
        run: |
          bash compile_script/platforms.sh
          python3 - <<'MATRIX_SCOPE'
          import json,os,re
          from pathlib import Path
          value=os.environ.get('FC_BUILD_PLATFORMS','').strip()
          if not value:raise SystemExit(0)
          names=[name.strip() for name in value.split(',')]
          if not names or any(not re.fullmatch(r'[A-Za-z0-9_]+',name) for name in names) or len(names)!=len(set(names)):
              raise SystemExit('Invalid or duplicate requested build platform')
          path=Path(os.environ['GITHUB_OUTPUT']);lines=path.read_text().splitlines()
          matrices=[line[7:] for line in lines if line.startswith('matrix=')]
          if len(matrices)!=1:raise SystemExit('Missing unique build matrix output')
          matrix=json.loads(matrices[0]);known={row['platform'] for row in matrix}
          unknown=set(names)-known
          if unknown:raise SystemExit('Unknown requested platforms: '+','.join(sorted(unknown)))
          selected=[row for row in matrix if row['platform'] in names]
          if len(selected)!=1 or selected[0]['source_code_platform']!='immortalwrt' or selected[0]['platform']!='X86_AllImages':
              raise SystemExit('Validation requires exactly ImmortalWrt X86_AllImages')
          lines=[line for line in lines if not line.startswith('matrix=')]
          lines.append('matrix='+json.dumps(selected,separators=(',',':')))
          path.write_text('\n'.join(lines)+'\n')
          print('Selected build platforms: '+','.join(names))
          MATRIX_SCOPE

  job_compile_and_upload:
    needs: job_init
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ !cancelled() && needs.job_init.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.job_init.outputs.platforms) }}
    name: Build-${{ matrix.source_code_platform }}-${{ matrix.platform }}
    continue-on-error: false

    steps:
      - name: Start AllImages build deadline
        if: matrix.platform == 'X86_AllImages'
        run: |
          # fullcone-allimages-job-deadline
          # Leave the final 30 minutes of the 360-minute job for cleanup and uploads.
          echo "FC_ALLIMAGES_COMPILE_STOP_EPOCH=$(($(date +%s) + 19800))" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Matrix Status
        id: matrix_status
        run: |
            chmod +x compile_script/matrix_job_status.sh
            $GITHUB_WORKSPACE/compile_script/matrix_job_status.sh "${{ github.token }}" "${{ github.repository }}" "${{ github.run_id }}" "${{ fromJSON(github.run_attempt) }}" "Build-${{ matrix.source_code_platform }}-${{ matrix.platform }}"

      - name: Server Info
        if: steps.matrix_status.outputs.status != 'success'
        run: |
            echo "---------------------CPU Info--------------------"
            lscpu
            echo "---------------------RAM Info--------------------"
            free -h

      - name: Initialization Environment
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir
          df -hT
  
      - name: Maximize Build Space
        if: steps.matrix_status.outputs.status != 'success'
        uses: smallprogram/maximize-build-diskspace@d08bf8a34c868f82333a929be6be18a52cd89657
        with:
          root-reserve-mb: 3072
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: '/workdir'

      - name: Free Disk Space
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          echo "==== Disk space before cleanup ===="
          df -hT
          echo "==== Clean disk space begin ===="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "==== Clean disk space complete ===="
          echo "==== Disk space after cleanup ===="
          df -hT
          
      - name: Install Packages
        if: steps.matrix_status.outputs.status != 'success'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          dependency_file="$GITHUB_WORKSPACE/diy_script/${{ matrix.source_code_platform }}_dependence"
          test -s "$dependency_file" || { echo "::error::Missing dependency manifest: $dependency_file"; exit 1; }
          read -r -a packages <<< "$(grep -Ev '^[[:space:]]*(#|$)' "$dependency_file" | xargs)"
          [ "${#packages[@]}" -gt 0 ] || { echo "::error::Dependency manifest is empty: $dependency_file"; exit 1; }
          sudo -E apt-get -qq install "${packages[@]}"


      - name: Install Rust musl targets
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
              echo "rustup is required for Rust target packages"
              exit 1
          fi
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustup target list --installed | grep -E '^(x86_64|aarch64)-unknown-linux-musl$'
      - name: Initialization Directory
        working-directory: /workdir
        id: init_directory
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          sudo mkdir -p openwrt
          sudo mkdir -p download
          sudo chown -R $USER:$GROUPS /workdir/openwrt
          sudo chown -R $USER:$GROUPS /workdir/download
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          ln -sf /workdir/download $GITHUB_WORKSPACE/download

      - name: Relocate Docker to /workdir
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          echo "==== 1. 停止 Docker 服务 ===="
          sudo systemctl stop docker
          echo "==== 2. 迁移 Docker 数据目录到宽敞的 /workdir ===="
          sudo mkdir -p /workdir/docker
          echo '{"data-root": "/workdir/docker"}' | sudo tee /etc/docker/daemon.json
          echo "==== 3. 重启 Docker 服务 ===="
          sudo systemctl start docker
          echo "==== 4. 验证迁移是否成功 ===="
          docker info | grep "Docker Root Dir"

      - name: Login to GitHub Container Registry
        if: steps.matrix_status.outputs.status != 'success'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify and download pinned source from production run 190
        id: download
        if: steps.matrix_status.outputs.status != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=14703090312
          pinned_sha=01ec6d11c6d1eacab070e580319c4da3043efae9281cf39d018eae485d1fea1c
          zip_file="$RUNNER_TEMP/allimages-source.zip"
          trap 'rm -f "$zip_file"' EXIT
          curl --fail --silent --show-error --location --retry 3 --max-time 300 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/fullcone/x86/actions/artifacts/$artifact_id/zip" -o "$zip_file"
          printf '%s  %s\n' "$pinned_sha" "$zip_file" | sha256sum --check -
          unzip -p "$zip_file" output.tar.gz > download/output.tar.gz
          test -s download/output.tar.gz

      - name: Extract Pristine Source
        if: steps.matrix_status.outputs.status != 'success'
        working-directory: /workdir
        run: |
          tar -xzf download/output.tar.gz
          rm -rf download/output.tar.gz
          sudo chown -R $USER:$GROUPS /workdir/openwrt

      - name: Load Configuration
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          [ -e ${{ matrix.value.CONFIGS }}/${{ matrix.platform }}.config ] && cp -r ${{ matrix.value.CONFIGS }}/${{ matrix.platform }}.config openwrt/.config
          cd openwrt
          make defconfig
          

      - name: Git Restore Mtime (True SSoT) And DL Restore Time
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          cd /workdir/openwrt
          echo "==== 遍历所有 Git 仓库并精准还原真实提交时间 ===="
          find . -name ".git" -type d | while read gitdir; do
              repo_dir=$(dirname "$gitdir")
              echo "-> 正在处理 Git 仓库: $repo_dir"
              cd "/workdir/openwrt/$repo_dir"
              git log --format=%at --name-only | perl -ane '
                if (/^(\d+)$/) { $t = $1; }
                elsif (/^(\S+)$/) {
                  $f = $1;
                  if (-e $f && !-d $f && !$seen{$f}) {
                    utime($t, $t, $f);
                    $seen{$f} = 1;
                  }
                }
              '
              cd /workdir/openwrt
          done

          find /workdir/openwrt/dl -type f | xargs -r touch -t 200001010000
          echo "✅ dl/ 时间戳逆转完成！"

      - name: Restore Entire OpenWrt Cache from GHCR
        id: restore_cache
        if: steps.matrix_status.outputs.status != 'success' && (fromJSON(github.run_attempt) < 3 || (fromJSON(github.run_attempt) == 3 && matrix.platform == 'X86_AllImages')) && env.FORCE_REBUILD != 'true'
        run: |

          df -hT

          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CACHE_PLATFORM="${{ matrix.platform }}"
          case "$CACHE_PLATFORM" in
            X86_VMware|X86_AllImages) CACHE_PLATFORM=X86 ;;
          esac
          PLATFORM_NAME=$(echo "${{ matrix.source_code_platform }}-$CACHE_PLATFORM" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_OWNER/openwrt-base-cache-v2-$PLATFORM_NAME:latest"

          restore_failed=0

          if docker pull "$IMAGE_NAME"; then
            echo "==== Found GHCR base cache, streaming chunks from image export ===="
            cd /workdir

            if docker create --name cache_container "$IMAGE_NAME" /bin/true; then
              if ! docker export cache_container | tar -xf - --wildcards "op_cache_raw_*"; then
                echo "::warning::Unable to extract cache chunks from image export."
                restore_failed=1
              fi
            else
              echo "::warning::Unable to create cache container."
              restore_failed=1
            fi

            docker rm cache_container >/dev/null 2>&1 || true
            docker rmi "$IMAGE_NAME" -f >/dev/null 2>&1 || true

            if [ "$restore_failed" -eq 0 ] && ls op_cache_raw_* 1> /dev/null 2>&1; then
               echo "==== Restoring merged base cache into OpenWrt ===="
               if cat op_cache_raw_* | tar -I "zstd -T0" -xf - -C /workdir/openwrt/; then
                  echo "Base cache restore completed."
               else
                  echo "::warning::GHCR base cache restore failed during extraction."
                  restore_failed=1
               fi
            elif [ "$restore_failed" -eq 0 ]; then
               echo "::warning::No cache chunks found in GHCR image."
               restore_failed=1
            fi

            rm -f /workdir/cache_exported.tar /workdir/op_cache_raw_*

            if [ "$restore_failed" -ne 0 ]; then
               echo "::warning::GHCR base cache restore failed; cleaning partial restored build state."
               rm -rf /workdir/openwrt/build_dir /workdir/openwrt/staging_dir
               mkdir -p /workdir/openwrt/build_dir /workdir/openwrt/staging_dir || true
               docker system prune -af || true
            fi
          else
            echo "No cache found on GHCR. This will be a clean build."
          fi

          df -hT
     

      - name: Free Disk After Cache Restore
        if: steps.matrix_status.outputs.status != 'success' && !cancelled()
        run: |
          set -euo pipefail
          SOFT_REQUIRED_MB=8192
          MODERATE_REQUIRED_MB=4096
          EMERGENCY_REQUIRED_MB=2048

          avail_mb() {
            df -Pm /workdir | awk 'NR==2 {print $4}'
          }

          disk_report() {
            echo "---- df ----"
            df -hT / /workdir || true
            echo "---- /workdir top level ----"
            du -h -d1 /workdir 2>/dev/null | sort -h || true
            echo "---- /workdir/openwrt top level ----"
            du -h -d1 /workdir/openwrt 2>/dev/null | sort -h || true
            echo "---- largest build_dir children ----"
            du -h -d1 /workdir/openwrt/build_dir 2>/dev/null | sort -h | tail -30 || true
            echo "---- largest staging_dir children ----"
            du -h -d1 /workdir/openwrt/staging_dir 2>/dev/null | sort -h | tail -30 || true
          }

          maybe_clean() {
            local label="$1"
            shift
            local required_mb="$1"
            shift
            local before
            before="$(avail_mb)"
            if [ "${before:-0}" -ge "$required_mb" ]; then
              echo "==== ${label}: skip, /workdir has ${before} MiB free, target ${required_mb} MiB ===="
              return 0
            fi
            echo "==== ${label}: /workdir has ${before} MiB free, target ${required_mb} MiB, running cleanup ===="
            "$@" || true
            echo "==== ${label}: now $(avail_mb) MiB free ===="
          }

          echo "==== Disk before tiered cleanup ===="
          disk_report
          docker system df || true

          echo "==== Prune Docker cache after GHCR restore ===="
          docker builder prune -af || true
          docker system prune -af --volumes || true

          maybe_clean "Phase 1 transient files" "$SOFT_REQUIRED_MB" bash -c '
            rm -rf /workdir/cache_exported.tar /workdir/op_cache_raw_* /workdir/layer* /workdir/download
            rm -rf /workdir/openwrt/tmp /workdir/openwrt/logs
            sudo rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/* || true
            rm -rf "$RUNNER_TEMP"/* || true
          '

          maybe_clean "Phase 2 target linux/rootfs intermediates" "$MODERATE_REQUIRED_MB" bash -c '
            find /workdir/openwrt/build_dir -mindepth 2 -maxdepth 2 \( -path "*/linux-*" -o -name "root-*" -o -name "json_info_files" \) -print -exec rm -rf {} + 2>/dev/null || true
            find /workdir/openwrt/build_dir -path "*/tmp/*" -prune -print -exec rm -rf {} + 2>/dev/null || true
            rm -rf /workdir/openwrt/bin/targets/*/*/packages 2>/dev/null || true
          '

          maybe_clean "Phase 3 target package build cache" "$EMERGENCY_REQUIRED_MB" bash -c '
            find /workdir/openwrt/build_dir -mindepth 1 -maxdepth 1 -type d -name "target-*" -print -exec rm -rf {} + 2>/dev/null || true
          '

          maybe_clean "Phase 4 target staging cache" "$EMERGENCY_REQUIRED_MB" bash -c '
            find /workdir/openwrt/staging_dir -mindepth 1 -maxdepth 1 -type d -name "target-*" -print -exec rm -rf {} + 2>/dev/null || true
            rm -rf /workdir/openwrt/staging_dir/packages 2>/dev/null || true
          '

          maybe_clean "Phase 5 full OpenWrt target cache fallback" "$EMERGENCY_REQUIRED_MB" bash -c '
            rm -rf /workdir/openwrt/build_dir/target-* /workdir/openwrt/staging_dir/target-*
          '

          echo "==== Disk after tiered cleanup ===="
          disk_report
          if [ "$(avail_mb)" -lt "$EMERGENCY_REQUIRED_MB" ]; then
            echo "::warning::/workdir still has less than ${EMERGENCY_REQUIRED_MB} MiB free after tiered cleanup"
          fi
      - name: Compile Base (Tools, Toolchain, Kernel, LongTime Packages)
        id: compile_base
        if: steps.matrix_status.outputs.status != 'success'
        run: |
          cd openwrt
          touch /workdir/base_compilation_marker

          echo "==== 开始download ===="

          LONG_TIME_TARGETS_DOWNLOAD=(
              "tools/download"
              "toolchain/download"
              # "package/feeds/packages/golang/host/download"
              # "package/feeds/packages/rust/host/download"
              # "package/feeds/packages/ruby/host/download"
              # "package/libs/gettext-full/host/download"
          )
          # fullcone Rust source verified 20261016
          case "${{ matrix.platform }}" in
            X86|X86_AllImages|X86_VMware)
              LONG_TIME_TARGETS_DOWNLOAD+=("package/feeds/packages/rust/download")
              ;;
          esac
          for target in "${LONG_TIME_TARGETS_DOWNLOAD[@]}"; do
              echo "==== 正在执行 download $target ===="
              download_log="$GITHUB_WORKSPACE/base-build-download-${target//\//-}.log"
              # fullcone Rust cached download 20261016
              download_options=()
              if [ "$target" = "package/feeds/packages/rust/download" ]; then
                # HostBuild omits download dependencies for autoremove cache stamps.
                # Override only this download invocation; preserve cached compiler state.
                download_options+=(CONFIG_AUTOREMOVE=)
              fi
              if make "$target" "${download_options[@]}" -j1 V=s > "$download_log" 2>&1; then
                tail -20 "$download_log"
              else
                status=$?
                tail -120 "$download_log"
                exit "$status"
              fi
              sleep 5
              echo "------------------------"
          done
          case "${{ matrix.platform }}" in
            X86|X86_AllImages|X86_VMware)
              rust_source_log="$GITHUB_WORKSPACE/base-build-rust-source-verification.log"
              if ! python3 "$GITHUB_WORKSPACE/compile_script/fullcone_rust_source.py" > "$rust_source_log" 2>&1; then
                cat "$rust_source_log"
                exit 1
              fi
              cat "$rust_source_log"
              ;;
          esac


          # echo "==== 3. 编译 Linux 内核 ===="
          # time make target/compile -j$(nproc) || exit 1

          echo "==== 编译包 ===="
          # fullcone bounded base toolchain diagnostic retry
          run_base_target() {
            local target="$1"
            shift
            local log="$GITHUB_WORKSPACE/base-build-${target//\//-}.log"
            if make "$target" -j$(nproc) V=s "$@" > "$log" 2>&1; then
              tail -20 "$log"
              return 0
            fi
            tail -120 "$log"
            [ "$target" = toolchain/compile ] || return 1
            case "${{ matrix.platform }}" in
              X86|X86_AllImages|X86_VMware) ;;
              *) return 1 ;;
            esac
            echo "::notice::Retrying failed toolchain once with -j1 V=s"
            if make "$target" -j1 V=s >> "$log" 2>&1; then
              tail -40 "$log"
              echo "::notice::Toolchain completed successfully on serial retry"
              return 0
            fi
            tail -120 "$log"
            return 1
          }
          LONG_TIME_TARGETS_COMPILE=(
              "tools/compile"
              "toolchain/compile"
              # "package/feeds/packages/golang/host/compile"
              # "package/feeds/packages/rust/host/compile"
              # "package/feeds/packages/ruby/host/compile"
              # "package/libs/gettext-full/host/compile"
          )
          # fullcone cache x86 Rust host compiler
          case "${{ matrix.platform }}" in
            X86|X86_AllImages|X86_VMware)
              LONG_TIME_TARGETS_COMPILE+=("package/feeds/packages/rust/host/compile")
              ;;
          esac
          for target in "${LONG_TIME_TARGETS_COMPILE[@]}"; do
              echo "==== 正在执行 compile $target ===="
              if [[ ${{ fromJSON(github.run_attempt) }} == 3 ]]; then
                  time run_base_target "$target" V=s || exit 1
                  sleep 5
                  echo "------------------------"
              else
                  time run_base_target "$target" || exit 1
                  sleep 5
                  echo "------------------------"
              fi
          done

      - name: Upload Base Compilation Diagnostics
        if: always() && steps.matrix_status.outputs.status != 'success' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: base_build_logs_${{ matrix.source_code_platform }}_${{ matrix.platform }}
          path: ${{ github.workspace }}/base-build-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Free Disk Before Final Compile
        if: steps.matrix_status.outputs.status != 'success' && !cancelled()
        run: |
          set -euo pipefail
          SOFT_REQUIRED_MB=8192
          MODERATE_REQUIRED_MB=4096
          EMERGENCY_REQUIRED_MB=2048

          avail_mb() {
            df -Pm /workdir | awk 'NR==2 {print $4}'
          }

          disk_report() {
            echo "---- df ----"
            df -hT / /workdir || true
            echo "---- /workdir top level ----"
            du -h -d1 /workdir 2>/dev/null | sort -h || true
            echo "---- /workdir/openwrt top level ----"
            du -h -d1 /workdir/openwrt 2>/dev/null | sort -h || true
            echo "---- largest build_dir children ----"
            du -h -d1 /workdir/openwrt/build_dir 2>/dev/null | sort -h | tail -30 || true
            echo "---- largest staging_dir children ----"
            du -h -d1 /workdir/openwrt/staging_dir 2>/dev/null | sort -h | tail -30 || true
          }

          maybe_clean() {
            local label="$1"
            shift
            local required_mb="$1"
            shift
            local before
            before="$(avail_mb)"
            if [ "${before:-0}" -ge "$required_mb" ]; then
              echo "==== ${label}: skip, /workdir has ${before} MiB free, target ${required_mb} MiB ===="
              return 0
            fi
            echo "==== ${label}: /workdir has ${before} MiB free, target ${required_mb} MiB, running cleanup ===="
            "$@" || true
            echo "==== ${label}: now $(avail_mb) MiB free ===="
          }

          echo "==== Disk before tiered cleanup ===="
          disk_report
          docker system df || true

          echo "==== Reset Docker storage after cache checkpoint ===="
          docker builder prune -af || true
          docker system prune -af --volumes || true
          sudo systemctl stop docker || true
          sudo rm -rf /workdir/docker
          sudo mkdir -p /workdir/docker
          sudo chown -R "$USER" /workdir/docker || true
          sudo systemctl start docker || true

          maybe_clean "Phase 1 transient files" "$SOFT_REQUIRED_MB" bash -c '
            rm -rf /workdir/cache_exported.tar /workdir/op_cache_raw_* /workdir/layer* /workdir/download
            rm -rf /workdir/openwrt/tmp /workdir/openwrt/logs
            sudo rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/* || true
            rm -rf "$RUNNER_TEMP"/* || true
          '

          maybe_clean "Phase 2 target linux/rootfs intermediates" "$MODERATE_REQUIRED_MB" bash -c '
            find /workdir/openwrt/build_dir -mindepth 2 -maxdepth 2 \( -path "*/linux-*" -o -name "root-*" -o -name "json_info_files" \) -print -exec rm -rf {} + 2>/dev/null || true
            find /workdir/openwrt/build_dir -path "*/tmp/*" -prune -print -exec rm -rf {} + 2>/dev/null || true
            rm -rf /workdir/openwrt/bin/targets/*/*/packages 2>/dev/null || true
          '

          maybe_clean "Phase 3 target package build cache" "$EMERGENCY_REQUIRED_MB" bash -c '
            find /workdir/openwrt/build_dir -mindepth 1 -maxdepth 1 -type d -name "target-*" -print -exec rm -rf {} + 2>/dev/null || true
          '

          maybe_clean "Phase 4 target staging cache" "$EMERGENCY_REQUIRED_MB" bash -c '
            find /workdir/openwrt/staging_dir -mindepth 1 -maxdepth 1 -type d -name "target-*" -print -exec rm -rf {} + 2>/dev/null || true
            rm -rf /workdir/openwrt/staging_dir/packages 2>/dev/null || true
          '

          maybe_clean "Phase 5 full OpenWrt target cache fallback" "$EMERGENCY_REQUIRED_MB" bash -c '
            rm -rf /workdir/openwrt/build_dir/target-* /workdir/openwrt/staging_dir/target-*
          '

          echo "==== Disk after tiered cleanup ===="
          disk_report
          if [ "$(avail_mb)" -lt "$EMERGENCY_REQUIRED_MB" ]; then
            echo "::warning::/workdir still has less than ${EMERGENCY_REQUIRED_MB} MiB free after tiered cleanup"
          fi
      - name: Download Package
        id: download_packages
        continue-on-error: true
        if: steps.matrix_status.outputs.status != 'success' && !cancelled() && steps.compile_base.outcome == 'success'
        # Package prefetch is best-effort; completion is reported through outputs and the final compile is authoritative.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/openwrt"

          # OpenWrt only sets a connect timeout. Bound established-but-stalled
          # curl, Git, and GitHub API transfers so another mirror can be tried.
          export CURL_OPTIONS="--speed-limit 1024 --speed-time 60 --retry 2 --retry-delay 2"
          export GIT_HTTP_LOW_SPEED_LIMIT=1024
          export GIT_HTTP_LOW_SPEED_TIME=60

          python3 - <<'PYDOWNLOAD'
          from pathlib import Path

          path = Path("scripts/dl_github_archive.py")
          text = path.read_text(encoding="utf-8")
          old = "urllib.request.urlopen(req, context=sslcontext)"
          new = "urllib.request.urlopen(req, context=sslcontext, timeout=60)"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Unsupported dl_github_archive.py urlopen implementation")
          PYDOWNLOAD

          download_log="$GITHUB_WORKSPACE/download-packages.log"
          download_stop_reason="$GITHUB_WORKSPACE/download-packages.stop-reason"
          : > "$download_log"
          rm -f "$download_stop_reason"

          download_diagnostics() {
            echo "::group::Download diagnostics"
            echo "Active downloader processes:"
            ps -eo pid,ppid,etime,stat,args --forest | \
              grep -E '(scripts/download\.pl|dl_github_archive|curl |wget |git (clone|fetch))' | \
              grep -v grep || true
            echo "Partial curl/wget payloads:"
            find dl -maxdepth 1 -type f -name '*.dl' -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort || true
            echo "Git fallback worktrees:"
            find tmp/dl -mindepth 1 -maxdepth 2 -printf '%TY-%Tm-%Td %TH:%TM:%TS %y %p\n' 2>/dev/null | tail -100 || true
            echo "::endgroup::"
          }

          download_progress_signature() {
            {
              find dl tmp/dl -type f -printf '%T@ %s\n' 2>/dev/null || true
            } | awk '
              { count += 1; bytes += $2; if ($1 > newest) newest = $1 }
              END { printf "%d:%0.0f:%.6f\n", count, bytes, newest }
            '
          }

          terminate_download_group() {
            local process_group="$1"
            kill -TERM -- "-${process_group}" 2>/dev/null || kill -TERM "$process_group" 2>/dev/null || true
            for _ in $(seq 1 30); do
              kill -0 -- "-${process_group}" 2>/dev/null || return 0
              sleep 1
            done
            kill -KILL -- "-${process_group}" 2>/dev/null || kill -KILL "$process_group" 2>/dev/null || true
          }

          max_download_seconds=2700
          idle_download_seconds=180
          max_download_attempts=3
          progress_check_seconds=30
          overall_download_started_at=$(date +%s)
          download_rc=1
          stop_reason=not-started
          : > "$download_log"

          echo "==== Best-effort package prefetch (max 45m total, retry after 3m without file progress, up to 3 attempts) ===="
          for download_attempt in $(seq 1 "$max_download_attempts"); do
            now=$(date +%s)
            total_elapsed=$((now - overall_download_started_at))
            if [ "$total_elapsed" -ge "$max_download_seconds" ]; then
              stop_reason=max-total-time-${total_elapsed}s
              break
            fi

            : > "$download_stop_reason"
            attempt_started_at=$now
            last_progress_at=$now
            last_progress_signature=$(download_progress_signature)
            echo "==== Package download attempt ${download_attempt}/${max_download_attempts} ====" | tee -a "$download_log"
            setsid make download -j8 V=s >>"$download_log" 2>&1 &
            download_pid=$!

            (
              while kill -0 "$download_pid" 2>/dev/null; do
                sleep "$progress_check_seconds"
                kill -0 "$download_pid" 2>/dev/null || break

                now=$(date +%s)
                total_elapsed=$((now - overall_download_started_at))
                attempt_elapsed=$((now - attempt_started_at))
                current_signature=$(download_progress_signature)
                if [ "$current_signature" != "$last_progress_signature" ]; then
                  last_progress_signature=$current_signature
                  last_progress_at=$now
                fi
                idle_for=$((now - last_progress_at))

                if [ "$total_elapsed" -ge "$max_download_seconds" ]; then
                  echo "max-total-time-${total_elapsed}s" > "$download_stop_reason"
                  terminate_download_group "$download_pid"
                  break
                fi
                if [ "$idle_for" -ge "$idle_download_seconds" ]; then
                  echo "attempt-${download_attempt}-no-file-progress-${idle_for}s" > "$download_stop_reason"
                  terminate_download_group "$download_pid"
                  break
                fi

                if [ "$attempt_elapsed" -eq "$progress_check_seconds" ] || [ $((attempt_elapsed % 300)) -eq 0 ]; then
                  echo "Package prefetch attempt ${download_attempt}: total=${total_elapsed}s attempt=${attempt_elapsed}s idle=${idle_for}s log=$(du -h "$download_log" | awk '{print $1}')"
                  tail -5 "$download_log" | sed 's/^/[download-tail] /' || true
                fi
              done
            ) &
            monitor_pid=$!

            set +e
            wait "$download_pid"
            download_rc=$?
            set -e
            if [ -s "$download_stop_reason" ]; then
              wait "$monitor_pid" 2>/dev/null || true
            else
              kill "$monitor_pid" 2>/dev/null || true
              wait "$monitor_pid" 2>/dev/null || true
            fi

            if [ "$download_rc" -eq 0 ]; then
              stop_reason=completed
              break
            fi

            # Ensure a failed make invocation cannot leave downloader children behind before retrying.
            terminate_download_group "$download_pid"
            stop_reason=command-exit-${download_rc}
            if [ -s "$download_stop_reason" ]; then
              stop_reason=$(cat "$download_stop_reason")
            fi
            echo "::warning::Package download attempt ${download_attempt} failed (${stop_reason}, exit ${download_rc})."
            download_diagnostics

            now=$(date +%s)
            total_elapsed=$((now - overall_download_started_at))
            if [ "$download_attempt" -ge "$max_download_attempts" ] || [ "$total_elapsed" -ge "$max_download_seconds" ]; then
              break
            fi
            retry_delay=$((download_attempt * 15))
            echo "Retrying package prefetch in ${retry_delay}s; completed downloads are kept."
            sleep "$retry_delay"
          done

          if [ "$download_rc" -eq 0 ]; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
            echo "Package prefetch completed successfully on attempt ${download_attempt}."
            rm -f "$download_stop_reason"
            exit 0
          fi

          echo "completed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Package prefetch incomplete after ${download_attempt} attempt(s) (${stop_reason}, exit ${download_rc}); final compile will fetch remaining files."
          echo "==== Last 300 lines from package download log ===="
          tail -300 "$download_log" || true
          rm -f "$download_stop_reason"
          exit 0

      - name: Upload Package Prefetch Logs
        if: always() && steps.download_packages.outcome != 'skipped' && steps.download_packages.outputs.completed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: download_logs_${{ matrix.source_code_platform }}_${{ matrix.platform }}_attempt_${{ github.run_attempt }}
          path: download-packages.log
          if-no-files-found: warn
          retention-days: 7
      - name: Compile Packages and Firmware
        id: compile
        if: steps.matrix_status.outputs.status != 'success' && !cancelled() && steps.compile_base.outcome == 'success'
        env:
          FC_BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          cd openwrt
          df -h

          if [[ "${{ matrix.source_code_platform }}" == "openwrt" ]]; then
            chmod +x $GITHUB_WORKSPACE/${{ matrix.value.DIY_P4_SH }} || true
            source $GITHUB_WORKSPACE/${{ matrix.value.DIY_P4_SH }}
            install_rustdesk_server
          fi
          

          set -o pipefail
          build_log="$GITHUB_WORKSPACE/build-${{ matrix.source_code_platform }}-${{ matrix.platform }}.log"

          echo "==== Fast parallel build, full log is written to $build_log ===="
          : > "$build_log"
          # fullcone-allimages-resource-telemetry
          sample_allimages_resources() {
              {
                  printf '\n=== %s ===\n' "$(date -u +%FT%TZ)"
                  printf 'CPUs: '; nproc || true
                  printf 'Load: '; cat /proc/loadavg || true
                  free -m || true
                  df -h "$PWD" || true
                  df -i "$PWD" || true
                  if [ -r /sys/fs/cgroup/memory.events ]; then
                      cat /sys/fs/cgroup/memory.events || true
                  fi
              } | tee -a "$GITHUB_WORKSPACE/allimages-resources.log" || true
          }
          if [[ "$FC_BUILD_PLATFORM" == X86_AllImages ]]; then
              : > "$GITHUB_WORKSPACE/allimages-resources.log"
              sample_allimages_resources
          fi
          (
              ticks=0
              while true; do
                  sleep 60
                  echo "::notice::Build still running at $(date -u +%H:%M:%S). Log size: $(du -h "$build_log" | awk '{print $1}')"
                  tail -5 "$build_log" | sed 's/^/[build-tail] /' || true
                  if [[ "$FC_BUILD_PLATFORM" == X86_AllImages ]]; then
                      ticks=$((ticks + 1))
                      if (( ticks % 5 == 0 )); then
                          sample_allimages_resources
                      fi
                  fi
              done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          set +e
          # fullcone-allimages-bounded-make
          if [[ "$FC_BUILD_PLATFORM" == X86_AllImages ]]; then
              if [[ ! "${FC_ALLIMAGES_COMPILE_STOP_EPOCH:-}" =~ ^[0-9]+$ ]]; then
                  echo '::error::AllImages compile deadline was not initialized.'
                  MAKE_EXIT_CODE=2
              else
                  remaining=$((FC_ALLIMAGES_COMPILE_STOP_EPOCH - $(date +%s)))
                  if (( remaining <= 0 )); then
                      echo '::error::AllImages compile budget was exhausted before make started.'
                      MAKE_EXIT_CODE=124
                  else
                      echo "AllImages: up to ${remaining}s remain for make."
                      # GNU timeout supervises make and its process group; do not use --foreground.
                      timeout --verbose --signal=TERM --kill-after=30s "${remaining}s" make -j"$(nproc)" V=s > "$build_log" 2>&1
                      MAKE_EXIT_CODE=$?
                      if [[ "$MAKE_EXIT_CODE" == 124 ]] || { [[ "$MAKE_EXIT_CODE" == 137 ]] && (( $(date +%s) >= FC_ALLIMAGES_COMPILE_STOP_EPOCH )); }; then
                          echo '::error::AllImages compile exceeded its time budget; preserving diagnostics before the job deadline.'
                      fi
                  fi
              fi
          else
              make -j$(nproc) V=s > "$build_log" 2>&1
              MAKE_EXIT_CODE=$?
          fi
          set -e
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT
          if [[ "$FC_BUILD_PLATFORM" == X86_AllImages ]]; then
              sample_allimages_resources
          fi

          if [ "$MAKE_EXIT_CODE" -ne 0 ]; then
              echo "::error::Parallel build failed with exit code $MAKE_EXIT_CODE"
              echo "==== Error context from parallel build log ===="
              grep -nEi "(make\\[[0-9]+\\]: \\*\\*\\*|ERROR:|Error:|FAILED:|No rule to make target|undefined reference|collect2: error|recipe for target|fatal error:|No space left on device|not found)" "$build_log" | tail -120 || true
              echo "==== Last 500 lines from parallel build log ===="
              tail -500 "$build_log" || true
              exit "$MAKE_EXIT_CODE"
          fi


      - name: Upload Build Logs On Failure
        if: failure() && steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: build_logs_${{ matrix.source_code_platform }}_${{ matrix.platform }}
          path: |
            ${{ github.workspace }}/build-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive complete compiler diagnostics
        if: always() && steps.matrix_status.outputs.status != 'success' && !cancelled()
        run: |
          set -euo pipefail
          mkdir -p compiler-diagnostics
          for log in build-*.log base-build-*.log allimages-resources.log; do
            [ ! -f "$log" ] || gzip -c "$log" > "compiler-diagnostics/$log.gz"
          done
          if [ -d openwrt/logs ]; then tar -czf compiler-diagnostics/package-logs.tar.gz -C openwrt logs; fi

      - name: Upload complete compiler diagnostics
        if: always() && steps.matrix_status.outputs.status != 'success' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: compiler_diagnostics_${{ matrix.source_code_platform }}_${{ matrix.platform }}_${{ github.run_attempt }}
          path: compiler-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

      - name: Organize Files
        id: organize
        if: steps.compile.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true' && steps.matrix_status.outputs.status != 'success' && !cancelled() 
        run: |
          cd $GITHUB_WORKSPACE/openwrt/bin/targets/*/*
          firmware_path=$PWD
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          metadata_prefix="${{ matrix.source_code_platform }}-${{ matrix.platform }}"
          for metadata in config.buildinfo feeds.buildinfo version.buildinfo profiles.json; do
            [ ! -f "$metadata" ] || mv "$metadata" "$metadata_prefix-$metadata"
          done
          if [ -f "$GITHUB_WORKSPACE/openwrt/source-versions.txt" ]; then
            cp "$GITHUB_WORKSPACE/openwrt/source-versions.txt" "$metadata_prefix-source-versions.txt"
          fi
          find . -maxdepth 1 -type f ! -name '*-*-*' ! -name sha256sums -delete

          if [[ "${{ matrix.platform }}" == "X86_AllImages" ]]; then
              for file in immortalwrt-x86-64-generic*; do
                  [ -f "$file" ] || continue
                  mv "$file" "${file/immortalwrt-x86-64-generic/immortalwrt-x86-64-generic-allimages}"
              done
              echo "==== Keep all optional x86 image formats with allimages names ===="
              ls -lh
          fi

          if [[ "${{ matrix.platform }}" == "X86_VMware" ]]; then
              for file in immortalwrt-x86-64-generic*; do
                  [ -f "$file" ] || continue
                  mv "$file" "${file/immortalwrt-x86-64-generic/immortalwrt-x86-64-generic-vmware}"
              done
              echo "==== Keep VMware release artifacts only ===="
              find . -maxdepth 1 -type f \
                  ! -name 'immortalwrt-x86-64-generic-vmware*combined*.vmdk*' \
                  ! -name 'immortalwrt-x86-64-generic-vmware.manifest' \
                  ! -name 'immortalwrt-x86-64-generic-vmware-kernel.bin' \
              ! -name "$metadata_prefix-*" \
              ! -name sha256sums \
                  -delete
              ls -lh
          fi

          if [[ "${{ matrix.source_code_platform }}" == "lede" ]]; then
              for file in openwrt-*; do
                  if [[ -f "$file" ]]; then
                      mv "$file" "${file/openwrt-/lede-}"
                  fi
              done
          fi

          python3 "$GITHUB_WORKSPACE/compile_script/fullcone_manifest.py" "$GITHUB_WORKSPACE/openwrt/.config" .
          rm -f sha256sums
          find . -maxdepth 1 -type f ! -name '*-sha256sums' -print0 | sort -z | xargs -0 sha256sum > "$metadata_prefix-sha256sums"
          echo "FIRMWARE=$firmware_path" >> $GITHUB_OUTPUT

      # - name: Download Tags (For Release Body)
      #   if: steps.organize.outcome == 'success' && steps.matrix_status.outputs.status != 'success'
      #   uses: actions/download-artifact@v8
      #   with:
      #     name: release_tag
      #     path: release_tag_download

      - name: Upload Firmware Directory To Artifact (Backup)
        uses: actions/upload-artifact@v7
        if: steps.organize.outcome == 'success' && env.UPLOAD_ARTIFACT == 'true' && steps.matrix_status.outputs.status != 'success' && !cancelled()
        with:
          name: ${{ matrix.source_code_platform }}_${{ matrix.platform }}_firmware
          path: ${{ steps.organize.outputs.FIRMWARE }}
          overwrite: true


      - name: Upload Bin Directory To Artifact (Backup)
        uses: actions/upload-artifact@v7
        if: steps.compile.outcome == 'success' && env.UPLOAD_BIN_DIR == 'true' && steps.matrix_status.outputs.status != 'success' && !cancelled()
        with:
          name: OpenWrt_bin_${{ matrix.source_code_platform }}_${{ matrix.platform }}
          path: openwrt/bin
          overwrite: true
